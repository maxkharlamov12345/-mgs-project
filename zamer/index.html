<style>

.logo b{background:var(--acc);color:#111;border-radius:8px;padding:2px 7px}
.top .sp{flex:1}
.tb{border:1px solid #3a3631;background:none;color:#e9e4da;border-radius:10px;padding:6px 11px;cursor:pointer;font-size:14px;white-space:nowrap}
.tb.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
.tb .bd{display:inline-block;margin-left:5px;font-size:11px;background:var(--err);color:#fff;border-radius:8px;padding:0 6px}
.main{display:grid;gap:8px;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.view{position:relative;background:#fff;border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;min-height:340px}

.tip b{color:var(--acc)}
.vbtn{position:absolute;right:8px;bottom:8px;}

.btn{border:0;border-radius:11px;padding:9px 13px;cursor:pointer;font-weight:600;background:#ece8df;font-size:14px}
.btn.p{background:var(--acc);color:#111}
.btn.d{background:var(--dark);color:#fff}
.btn.s{padding:6px 10px;font-size:13px;font-weight:500}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.red{background:#fde8e6;color:var(--err)}
.btn:disabled{opacity:.4}
.btn:focus-visible,.chip:focus-visible,.tb:focus-visible{outline:3px solid #9db21c;outline-offset:2px}
.card{background:var(--card);border-radius:14px;padding:10px 12px;overflow:auto}

.hint{font-size:12.5px;color:var(--mute);margin:0 0 6px}

  .v3 .lg{display:none}
}
