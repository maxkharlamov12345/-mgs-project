<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MGS Конструктор замера</title>
<meta name="description" content="Замерщик чертит контур комнаты, дальше всё в 3D на весь экран: окна, двери, ниши, короба, розетки, вода, газ, отопление — размеры вписываются цифрами. Файл для PRO100.">
<meta name="theme-color" content="#151311">
<link rel="icon" href="../assets/logo.webp">
<style>
@font-face{font-family:Onest;font-style:normal;font-weight:100 900;font-display:swap;src:url(../assets/fonts/onest-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-style:normal;font-weight:100 900;font-display:swap;src:url(../assets/fonts/onest-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Макет: одно окно на весь экран (этап 1 — план, этап 2 — 3D), сверху тонкая шапка, слева меню объектов, поверх — всплывающие окна с цифрами. Палитра MGS. */
:root{--bg:#e9e6df;--card:#fff;--ink:#1b1916;--mute:#77726a;--line:#e3dfd6;--acc:#bfd630;--dark:#151311;--cur:#ff5a1f;--err:#d93025;--ok:#3d9a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 Onest,system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
.top{flex:none;background:var(--dark);color:#f4f1ec;padding:calc(env(safe-area-inset-top) + 5px) max(10px,env(safe-area-inset-right)) 5px max(10px,env(safe-area-inset-left));display:flex;align-items:center;gap:6px;z-index:30}
.logo{font-weight:700;display:flex;gap:7px;align-items:center;white-space:nowrap}
.logo b{background:var(--acc);color:#111;border-radius:7px;padding:1px 6px}
.nm{color:#bdb7ab;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tb{border:1px solid #3a3631;background:none;color:#e9e4da;border-radius:10px;padding:5px 10px;cursor:pointer;font-size:14px;white-space:nowrap}
.tb.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
.tb .bd{display:inline-block;margin-left:5px;font-size:11px;background:var(--err);color:#fff;border-radius:8px;padding:0 6px}
.tb:disabled{opacity:.35}
.stage{position:relative;flex:1;min-height:0}
#plan,#v3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#plan{background:#fff}
.tip{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(21,19,17,.9);color:#f4f1ec;border-radius:12px;padding:7px 13px;font-size:14px;pointer-events:none;max-width:90%;text-align:center;z-index:12}
.tip b{color:var(--acc)}
.fab{position:absolute;z-index:11;display:flex;gap:6px;flex-wrap:wrap}
.fab.br{right:max(10px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));justify-content:flex-end}
.fab.tr{right:max(10px,env(safe-area-inset-right));top:10px}
.side{position:absolute;left:max(8px,env(safe-area-inset-left));top:8px;bottom:calc(8px + env(safe-area-inset-bottom));width:240px;background:rgba(255,255,255,.96);border-radius:14px;box-shadow:0 4px 18px #0002;overflow:auto;z-index:10;padding:8px}
.side h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:10px 6px 4px}
.side .ch{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:8px 6px;font-weight:600;font-size:14px;cursor:pointer;text-align:left;border-radius:10px}
.side .ch:hover{background:#f3f1ec}
.side .ch .ar{margin-left:auto;color:var(--mute)}
.side .its{display:grid;gap:2px;padding:0 0 6px 6px}
.side .it{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 8px;border-radius:9px;cursor:pointer;font-size:13.5px;text-align:left}
.side .it:hover{background:#f3f1ec}
.side .it.on{background:var(--dark);color:#fff}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.side .tg{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13.5px;cursor:pointer;border-radius:9px}
.side .tg input{width:18px;height:18px;accent-color:#7e8f12}
.pop{position:absolute;z-index:20;right:max(10px,env(safe-area-inset-right));top:10px;width:360px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border-radius:16px;box-shadow:0 8px 30px #0003;padding:12px 14px}
.pop h2{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.x{margin-left:auto;border:0;background:#f0ede6;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px;flex:none}
.hint{font-size:12.5px;color:var(--mute);margin:0 0 8px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f .w2{grid-column:1/-1}
.f label{font-size:12px;color:var(--mute);display:block}
.f input,.f select{width:100%;font-size:19px;font-weight:600;padding:6px 10px;border:2px solid var(--line);border-radius:10px;outline:none;font-variant-numeric:tabular-nums;background:#fff}
.f select{font-size:15px}
.f input:focus,.f select:focus{border-color:var(--cur);box-shadow:0 0 0 3px #ff5a1f30}
.f input.est{color:var(--cur);font-weight:500}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row.mt{margin-top:10px}
.sp{flex:1}
.btn{border:0;border-radius:11px;padding:9px 13px;cursor:pointer;font-weight:600;background:#ece8df;font-size:14px}
.btn.p{background:var(--acc);color:#111}
.btn.d{background:var(--dark);color:#fff}
.btn.s{padding:6px 10px;font-size:13px;font-weight:500}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.red{background:#fde8e6;color:var(--err)}
.btn:disabled{opacity:.4}
.btn:focus-visible,.tb:focus-visible,.it:focus-visible,.ch:focus-visible{outline:3px solid #9db21c;outline-offset:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.issues div{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.issues div:last-child{border:0}
.phs{display:flex;gap:6px;flex-wrap:wrap}
.phs img{width:58px;height:58px;object-fit:cover;border-radius:8px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.e{background:#fde8e6;color:var(--err)}
.pill.ok{background:#e6f3e2;color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:9px 15px;border-radius:12px;z-index:90;font-size:14px;max-width:90vw}
[hidden]{display:none!important}
@media (max-width:699px){
  .side{left:0;right:0;top:auto;bottom:0;width:auto;max-height:62%;border-radius:16px 16px 0 0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .pop{left:0;right:0;top:auto;bottom:0;width:auto;max-height:66%;border-radius:16px 16px 0 0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .tb{padding:4px 8px;font-size:13px}
  .nm{display:none}
}
@media (max-height:520px){.pop{width:330px;padding:8px 11px}.f input{font-size:17px;padding:4px 9px}.side{width:220px}}
