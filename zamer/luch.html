    const a3 = V3(...Sp), b3 = V3(...E), len3 = a3.distanceTo(b3);   // луч — тонкая трубка (обычная линия на планшете почти не видна)
    const ln = new THREE.Mesh(new THREE.CylinderGeometry(.006, .006, len3, 8), new THREE.MeshBasicMaterial({ color: col, depthTest: false, transparent: true, opacity: .9 }));
    ln.position.copy(a3).add(b3).multiplyScalar(.5); ln.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b3.clone().sub(a3).normalize()); ln.renderOrder = 9; grp.add(ln);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(.022, 12, 8), new THREE.MeshBasicMaterial({ color: col, depthTest: false })); dot.position.copy(V3(...Sp)); dot.renderOrder = 9; grp.add(dot);
    const dot2 = dot.clone(); dot2.scale.setScalar(.6); dot2.position.copy(V3(...E)); grp.add(dot2);
    addLabel(V3((Sp[0] + E[0]) / 2, (Sp[1] + E[1]) / 2, (Sp[2] + E[2]) / 2), (m.dir === 'up' || m.dir === 'down' ? 'h ' : '') + (m.v > 0 ? fmt(m.v) : '? (' + fmt(s) + ')') + (bad ? ' ≠ ' + fmt(s) : ''), !(m.v > 0) || on ? 'cur' : bad ? 'bad' : '');
  });
  W.forEach((w, i) => { const t = top[i], h = top[(i - 1 + n) % n]; addLabel(V3((t[0] + h[0]) / 2 + w.n[0] * 60, (t[1] + h[1]) / 2 + w.n[1] * 60, (t[2] + h[2]) / 2 + 120), 'Стена ' + (i + 1), 'wn', i); });
  renderSide(); tip();
}
function addLabel(pos, txt, cls, wall) { const el = document.createElement('div'); el.className = 'lb ' + (cls || ''); el.textContent = txt; $('#labels').appendChild(el); labels.push({ el, pos, wall }); }
function bounds() { const xs = R.pts.map(p => p.x), ys = R.pts.map(p => p.y); return { cx: (Math.min(...xs) + Math.max(...xs)) / 2, cy: (Math.min(...ys) + Math.max(...ys)) / 2, R: Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), 2000) }; }
function camView(v) {
  const b = bounds(), cx = b.cx * k, cz = -b.cy * k, Rr = b.R * k * (cam.aspect < 1 ? Math.pow(1 / cam.aspect, .85) : 1);
  if (v === 'top') { cam.position.set(cx, Rr * 2 + 2, cz + .001); ctl.target.set(cx, 0, cz); }
  else if (v === 'in') { cam.position.set(cx, 1.55, cz + Rr * .32); ctl.target.set(cx, 1.2, cz - .5); }
  else { cam.position.set(cx + Rr * .55, Rr * 1.05 + 1.4, cz + Rr * 1.25); ctl.target.set(cx, R.H * k * .3, cz); }
  ctl.update();
}
function ghost() {   // стены между камерой и комнатой — прозрачные
  const cp = cam.position; const gs = W.map((w, i) => { const m = V3((w.a.x + w.b.x) / 2, (w.a.y + w.b.y) / 2, 0); return (cp.x - m.x) * w.n[0] + (-(cp.z - m.z)) * w.n[1] < 0; });
  grp.children.forEach(o => { if (o.userData.edge != null) o.material.opacity = gs[o.userData.edge] ? .2 : 1; else if (o.userData.id && o.userData.id[0] === 'w') { const g = gs[o.userData.i]; o.material.opacity = g ? .12 : 1; o.material.depthWrite = !g; o.userData.ghost = g; } });
  labels.forEach(l => { const p = l.pos.clone().project(cam), hide = p.z > 1 || (l.wall != null && gs[l.wall]); l.el.style.display = hide ? 'none' : ''; if (!hide) { l.el.style.left = (p.x + 1) / 2 * cv.clientWidth + 'px'; l.el.style.top = (1 - p.y) / 2 * cv.clientHeight + 'px'; } });
}
(function loop() { requestAnimationFrame(loop); ctl.update(); ghost(); rr.render(sc, cam); })();

/* ---------- касание: поставить точку замера ---------- */
const rc = new THREE.Raycaster(); let down = null;
cv.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
cv.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 7 || S.mode !== 'new') return;
  const b = cv.getBoundingClientRect(); rc.setFromCamera(new THREE.Vector2((e.clientX - b.left) / b.width * 2 - 1, -(e.clientY - b.top) / b.height * 2 + 1), cam);
  const inside = cam.position.y < R.H * k;   // потолок можно выбрать, только когда смотрим изнутри (снизу)
  const hit = rc.intersectObjects(grp.children.filter(o => o.isMesh && o.userData.id && !o.userData.ghost && (o.userData.id !== 'c' || inside)))[0]; if (!hit) return;
  const id = hit.object.userData.id, X = [hit.point.x / k, -hit.point.z / k, hit.point.y / k], r10 = v => Math.round(v / 10) * 10; let src;
  if (id === 'f' || id === 'c') src = { s: id, x: r10(X[0]), y: r10(X[1]) };
  else { const i = +id.slice(1), w = W[i]; src = { s: 'w', i, u: r10(Math.max(0, Math.min(w.L, w.d[0] * (X[0] - w.a.x) + w.d[1] * (X[1] - w.a.y)))), z: r10(Math.max(0, Math.min(R.H, X[2]))) }; }
  const m = { id: uid(), src, dir: src.s === 'f' ? 'up' : src.s === 'c' ? 'down' : 'perp', v: null }; m.tgt = target(m);
  R.meas.push(m); S.sel = m.id; save(); build(); openPop(m.id, true);
});

/* ---------- окно замера ---------- */
const SURF = s => s.s === 'f' ? 'Пол' : s.s === 'c' ? 'Потолок' : 'Стена ' + (s.i + 1);
const TGT = id => !id ? 'никуда' : id === 'f' ? 'пол' : id === 'c' ? 'потолок' : 'стену ' + (+id.slice(1) + 1);
const DIRS = [['perp', '→ напротив'], ['left', '← вдоль'], ['right', 'вдоль →'], ['up', '↑ потолок'], ['down', '↓ пол']];
function openPop(id, focus) {
  const m = R.meas.find(q => q.id === id), el = $('#pop'); if (!m) { el.hidden = true; return; } S.sel = id;
  const pv = m.tgt ? pred(m, P) : null, s = m.src;
  el.innerHTML = '<h2>Замер: ' + SURF(s) + ' → ' + TGT(m.tgt) + '<button class="x" data-a="close" aria-label="Закрыть">✕</button></h2>' +
    '<p class="hint">Точка — куда приложили дальномер. Выберите, куда «стреляли», и впишите цифру.</p>' +
    (s.s === 'w' ? '<div class="lbl">Куда стреляли</div><div class="row">' + DIRS.map(d => '<button class="btn s ' + (m.dir === d[0] ? 'on' : 'ghost') + '" data-dir="' + d[0] + '">' + d[1] + '</button>').join('') + '</div>' : '') +
    '<div class="f" style="margin-top:10px"><div class="w2"><label for="fV">Показал дальномер, мм</label><input id="fV" class="big" inputmode="decimal" autocomplete="off" value="' + (m.v > 0 ? m.v : '') + '" placeholder="' + (pv != null && isFinite(pv) ? fmt(pv) : '—') + '"></div>' +
    (s.s === 'w' ? '<div><label for="fU">От левого угла, мм</label><input id="fU" inputmode="decimal" value="' + fmt(s.u) + '"></div><div><label for="fZ">От пола, мм</label><input id="fZ" inputmode="decimal" value="' + fmt(s.z) + '"></div>' : '') + '</div>' +
    '<div class="calc">' + (m.tgt ? 'В модели сейчас: <b>' + fmt(pv) + '</b> мм' + (m.v > 0 && Math.abs(pv - m.v) > 2 ? ' — <b style="color:#d93025">не сходится с другими замерами</b>' : '') + (m.v > 0 && Math.abs(m.v - nominal(m)) > 250 ? '<br><b style="color:#d93025">Отличается от плана на ' + fmt(Math.abs(m.v - nominal(m))) + ' мм — проверьте цифру или контур</b>' : '') : '<b style="color:#d93025">Луч никуда не упирается — смените направление</b>') + '</div>' +
    '<div class="row mt"><button class="btn s red" data-a="del">Удалить</button><span class="sp"></span><button class="btn p" data-a="close">Готово</button></div>';
  el.hidden = false; renderSide();
  if (focus) setTimeout(() => { const f = $('#fV'); if (f) { try { f.focus({ preventScroll: true }); } catch (e) {} } }, 40);
}
function closePop() { const m = R.meas.find(q => q.id === S.sel); if (m && !(m.v > 0)) R.meas = R.meas.filter(q => q !== m); S.sel = null; $('#pop').hidden = true; save(); build(); }
document.addEventListener('change', e => {
  const m = R.meas.find(q => q.id === S.sel); if (!m) return; const v = num(e.target.value);
  if (e.target.id === 'fV') m.v = v > 0 ? v : null;
  else if (e.target.id === 'fU' && v != null) m.src.u = Math.max(0, Math.min(W[m.src.i].L, v));
  else if (e.target.id === 'fZ' && v != null) m.src.z = Math.max(0, Math.min(R.H, v));
  else return;
  m.tgt = target(m); save(); build(); openPop(m.id);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.target.blur(); } });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a],[data-dir],[data-cam],[data-ms]'); if (!b) return; const d = b.dataset;
  if (d.cam) { camView(d.cam); return; }
  if (d.ms) { openPop(d.ms); build(); return; }
  const m = R.meas.find(q => q.id === S.sel);
  if (d.dir && m) { m.dir = d.dir; m.tgt = target(m); save(); build(); openPop(m.id, true); return; }
  if (d.a === 'close') { closePop(); return; }
  if (d.a === 'del' && m) { R.meas = R.meas.filter(q => q !== m); S.sel = null; $('#pop').hidden = true; save(); build(); return; }
  if (d.a === 'reset') { if (!S.cR) { S.cR = 1; b.textContent = 'Стереть все замеры? Ещё раз'; return; } S.cR = 0; R = fresh(); P = []; save(); geom(); build(); camView('out'); return; }
  if (d.a === 'demo') { demo(); return; }
});
$('#bList').onclick = () => { S.list = !S.list; renderSide(); };
$('#bNew').onclick = () => { S.mode = S.mode === 'new' ? 'look' : 'new'; $('#bNew').classList.toggle('on', S.mode === 'new'); tip(); };

/* ---------- список и отклонения ---------- */
function renderSide() {
  const el = $('#side'); el.hidden = !S.list; $('#bList').classList.toggle('on', S.list); if (!S.list) return;
  const n = W.length; let h = '<div class="row"><b style="font-size:15px">Замеры</b><span class="sp"></span><button class="x" onclick="" data-a="hide" aria-label="Скрыть" id="sideX">✕</button></div>';
  h += R.meas.length ? R.meas.map(m => { const pv = m.tgt ? pred(m, P) : NaN, bad = m.v > 0 && Math.abs(pv - m.v) > 2; return '<div class="ms' + (S.sel === m.id ? ' on' : '') + '" data-ms="' + m.id + '"><span>' + SURF(m.src) + ' → ' + TGT(m.tgt) + '</span><span class="v" style="color:' + (bad ? '#d93025' : m.v > 0 ? '#1b1916' : '#e2531b') + '">' + (m.dir === 'up' || m.dir === 'down' ? 'h ' : '') + (m.v > 0 ? fmt(m.v) : '?') + '</span></div>'; }).join('') : '<p class="hint" style="padding:0 6px">Пока нет. Коснитесь стены, пола или потолка там, куда приложили дальномер.</p>';
  h += '<h3>Что получилось</h3>';

  for (let i = 0; i < n; i++) { const [, , t] = wp(P, i), lean = t * R.H / 1000; if (Math.abs(lean) >= .5) dev.push('<div class="dv">Стена ' + (i + 1) + ': верх ' + (lean > 0 ? 'наклонён в комнату' : 'уходит от комнаты') + ' на <b>' + fmt(Math.abs(lean)) + ' мм</b></div>'); }
  const c = 3 * n, hs = [P[c], P[c + 1], P[c + 2]]; if (Math.abs(hs[0]) >= .5 || Math.abs(hs[1]) >= .3 || Math.abs(hs[2]) >= .3) dev.push('<div class="dv">Потолок: в центре <b>h ' + fmt(R.H + hs[0]) + '</b>' + (Math.abs(hs[1]) >= .3 || Math.abs(hs[2]) >= .3 ? ', уклон до <b>' + fmt(Math.max(Math.abs(hs[1]), Math.abs(hs[2]))) + ' мм на 1 м</b>' : '') + '</div>');
  h += dev.join('') + '<p class="hint" style="padding:4px 6px 0">Пока замеров мало, модель держит прямые углы и вертикаль — двигается только то, что показали лучи.</p>';
  h += '<div class="row mt" style="padding:0 4px"><button class="btn s ghost" data-a="demo">Пример замеров</button><button class="btn s red" data-a="reset">Сбросить</button></div>';
  el.innerHTML = h; const x = $('#sideX'); if (x) x.onclick = () => { S.list = false; renderSide(); };
}
function tip() {
  const t = $('#tip'); let h = '';
  if (S.mode === 'new' && !$('#pop').hidden) h = '';
  else if (S.mode === 'new') h = R.meas.length ? 'Коснитесь места, куда приложили дальномер — <b>новый замер</b>' : 'Коснитесь стены, пола или потолка <b>там, куда приложили дальномер</b>';
  else h = 'Просмотр: крутите комнату. «＋ Замер» — ставить точки';
  t.hidden = !h; t.innerHTML = h;
}
function demo() {   // показательный набор: кухня с заваленным углом и наклонной стеной
  geom(); const L0 = W[0].L, mk = (src, dir, v) => { const m = { id: uid(), src, dir, v }; m.tgt = target(m); R.meas.push(m); };
  R.meas = [];
  const n = W.length, side = (n + 0 - 1) % n;   // левая боковая стена относительно стены 1
  mk({ s: 'w', i: side, u: Math.max(50, W[side].L - 50), z: 900 }, 'perp', Math.round(L0 - 4));   // у стены 1, на высоте столешницы
  mk({ s: 'w', i: side, u: Math.max(50, W[side].L - 650), z: 900 }, 'perp', Math.round(L0 - 15));  // на глубине 600 — уже на 11 мм
  mk({ s: 'w', i: side, u: Math.max(50, W[side].L - 50), z: 2400 }, 'perp', Math.round(L0 + 2));  // под потолком
  mk({ s: 'f', x: Math.round(CX), y: Math.round(CY) }, 'up', R.H - 8);
  mk({ s: 'f', x: Math.round(W[0].a.x + W[0].d[0] * 300 + W[0].n[0] * 300), y: Math.round(W[0].a.y + W[0].d[1] * 300 + W[0].n[1] * 300) }, 'up', R.H - 14);
  S.sel = null; $('#pop').hidden = true; save(); build(); toast('Пример: 5 замеров — проём на глубине 600 уже, потолок с уклоном');
}

geom(); build(); camView('out'); tip();
$('#nm').textContent = R.name + (fromMain() ? '' : ' · контур примера (в основном замере нет замкнутого плана)');
window.addEventListener('resize', () => { size(); });
</script>
