<body>
<template data-dc>
<helmet>
<style>
body{margin:0;background:#0f0e0c}
a{color:#f4f1ec}a:hover{color:#bfd630}
.pin{display:block;margin:0}
.pin-img{transition:transform .5s ease, filter .3s ease}
/* видео-плитки: под видео — картинка его первого кадра; видео проявляется только когда показало кадр (Safari иначе мигает чёрным) */
.feed-v{opacity:0;transition:opacity .2s ease}
.feed-v.ready{opacity:1}
.pin-btn:hover .pin-img{transform:scale(1.035);filter:brightness(.82)}
.pin-meta{opacity:0;transition:opacity .25s ease}
.pin-btn:hover .pin-meta,.pin-btn:focus-visible .pin-meta{opacity:1}
.chip{transition:background-color .2s ease,color .2s ease}
.chip:hover{background:#322d29}
.lb-thumbs{scrollbar-width:none}
.lb-vlist,.lb-vcount,.lb-close-v{display:none}
.lb-thumbs-grid{display:none !important}
.lb-hide{display:none !important}
.lb-wrap{overscroll-behavior:contain}
.lb-track .lb-slide{transition:opacity .5s ease, filter .5s ease}
.lb-track .lb-slide.rs-dim{filter:brightness(.28)}
.lb-track.lb-reels ~ .lb-fade-r{background:linear-gradient(to right, rgba(11,10,9,0) 0%, rgba(11,10,9,0.03) 15%, rgba(11,10,9,0.09) 30%, rgba(11,10,9,0.2) 45%, rgba(11,10,9,0.36) 60%, rgba(11,10,9,0.56) 75%, rgba(11,10,9,0.78) 88%, rgba(11,10,9,1) 100%) !important}
.lb-reels .lb-slide.rs-prev{opacity:0;pointer-events:none}
.lb-reels .lb-slide.rs-next{filter:brightness(.28)}
.lb-track.rs-nt .lb-slide{transition:none}
.rr-strip{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rr-strip::-webkit-scrollbar{display:none}
.rr-strip .rr-item{height:500px}
.lb-track{position:relative;display:flex;gap:16px;width:100%;height:100%;box-sizing:border-box;padding:24px 0 24px 50%;overflow-x:hidden;scroll-snap-type:none;scroll-padding-left:24px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lb-track::-webkit-scrollbar{display:none}
.lb-slide{flex:none;height:100%;scroll-snap-align:start;scroll-snap-stop:always}
.lb-slide-img{display:block;height:100%;width:auto;max-width:calc(100vw - 520px);object-fit:cover;border-radius:14px}
.lb-reels .lb-slide-img{max-width:calc(100vw - 160px)}
.lb-spacer{flex:0 0 70%}
@media (max-width: 760px){
  .feed,.feed-col{gap:5px !important}
  .pad{padding-left:5px !important;padding-right:5px !important}
  header.pad{padding-left:12px !important;padding-right:12px !important}
  .pin-btn,.pin{border-radius:10px !important}
  .about-band{border-radius:12px !important}
  .ttl{font-size:34px !important}
  .logo-img{width:52px !important;height:52px !important}
  .hide-m{display:none}
  .hdr-cta{padding:0 16px !important;font-size:14px !important;min-height:44px !important}
  .chips-nav{flex-wrap:nowrap !important;justify-content:flex-start !important;overflow-x:auto;scrollbar-width:none;padding-top:14px !important;padding-bottom:16px !important}
  .chips-nav .chip{flex:none;white-space:nowrap}
  .about-band{padding:22px 18px !important}
  .about-band p{font-size:16px !important}
  .rr-list{gap:5px !important}
  .rr-strip{gap:5px !important}
  .rr-strip .rr-item{height:300px}
  .rr-arrows{display:none !important}
  .rr-item{border-radius:10px !important}
  .rr-head{padding:22px 18px !important;border-radius:10px !important}
  .rr-title{font-size:30px !important}
}
/* невысокие экраны ПК: компактнее блок описания, чтобы кнопка была видна без прокрутки */
@media (min-width: 1000px) and (max-height: 720px){
  .lb-panel{padding:20px 24px 22px !important;gap:14px !important}
  .lb-panel h2{font-size:30px !important}
  .lb-panel p{font-size:14px !important;line-height:1.5 !important}
  .lb-panel dl > div{padding:7px 0 !important}
}
/* телефон боком: фото не выше экрана, иначе свайп застревает */
@media (max-width: 999px) and (orientation: landscape){
  .lb-vslide img{max-height:calc(100vh - 10px);max-height:calc(100svh - 10px);object-fit:contain !important;background:#0b0a09 !important}
}
/* просмотр: на телефонах и планшетах в портрете — вертикальный слайдер */
@media (max-width: 999px){
  .lb-img{max-height:60vh !important}
  .lb-wrap{flex-direction:column !important;overflow-y:auto;scroll-snap-type:y mandatory;scroll-padding-top:5px;-webkit-overflow-scrolling:touch}
  .lb-stage{display:none !important}
  .lb-vlist{display:flex !important;flex-direction:column;gap:5px;flex:none;padding:5px 5px 0}
  .lb-vslide img{border-radius:10px}
  .lb-vslide .v-snd{top:auto !important;bottom:38px}
  .lb-vvid{height:min(177.78vw, calc(100vh - 10px));height:min(177.78vw, calc(100svh - 10px))}
  .lb-vslide{scroll-snap-align:start;scroll-snap-stop:always}
  .lb-panel{scroll-snap-align:start}
  .lb-vcount{display:inline-flex !important}
  .lb-close-v{display:flex !important}
  .lb-stage{flex:none !important;height:var(--lbh, 125vw);max-height:82vh;padding:0 !important;transition:height .3s ease}
  .lb-desktop{display:none !important}
  .lb-thumbs-grid{display:none !important}
  .lb-track{gap:0 !important;padding:0 !important;scroll-padding-left:0 !important;overflow-x:auto !important;scroll-snap-type:x mandatory !important}
  .lb-slide{flex:0 0 100% !important;scroll-snap-align:center !important}
  .lb-slide-img{width:100% !important;height:100% !important;object-fit:cover;border-radius:0 !important}
  .lb-spacer,.lb-fade{display:none !important}
  .lb-count{left:50% !important;transform:translateX(-50%)}
  .lb-panel{width:auto !important;border-left:0 !important;overflow:visible !important;padding:22px 16px 28px !important}
  .lb-close-m{display:flex !important;position:fixed !important;top:14px !important;right:14px !important;z-index:60 !important}
  .lb-panel-head{display:none !important}
}
</style>
</helmet>

<div style="font-family: Onest, system-ui, sans-serif; color: #f4f1ec; background: #0f0e0c; min-height: 100%">


  <!-- заголовок проекта -->
  <section class="pad" style="padding: 44px 32px 8px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
    <h1 class="ttl" style="margin: 0; font-weight: 300; font-size: 54px; line-height: 1.05; letter-spacing: -0.02em; max-width: 900px">{{title}}</h1>
    <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 14px; color: #a89f92">
      <span>{{zonesLine}}</span><span aria-hidden="true">·</span><span>{{photosLine}}</span><span aria-hidden="true">·</span><span>ЖК Домашний, Москва, 2025</span>
    </div>
  </section>

  <!-- фильтр по зонам -->
  <sc-if value="{{multiZone}}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Зоны проекта" class="pad chips-nav" style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 18px 32px 26px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <button class="chip" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}">{{c.name}} <span style="opacity: 0.6; font-weight: 400">{{c.count}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin-left: 8px; vertical-align: -2px; opacity: 0.7"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></button>
      </sc-for>
    </nav>
  </sc-if>
  <sc-if value="{{singleZone}}" hint-placeholder-val="{{ false }}"><div style="height: 24px"></div></sc-if>

  <!-- о проекте: на всю ширину (телефон и маленькие проекты; на ПК — карточкой в ленте) -->
  <sc-if value="{{showBandTop}}" hint-placeholder-val="{{ false }}">
  <section class="pad" style="padding: 0 12px 16px">
    <div class="about-band" style="max-width: {{maxW}}; margin: 0 auto; border-radius: 18px; background: #1b1916; padding: 28px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 48px">
      <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px; max-width: 820px">
        <span style="font-size: 13px; color: #a39a8e; letter-spacing: 0.08em; text-transform: uppercase">О проекте</span>
        <p style="margin: 0; font-size: 18px; line-height: 1.55">Светлая квартира, где мебель почти растворяется в стенах: белые матовые фасады без ручек, шкафы до потолка, тёплый дуб в полу и мебели. П-образная кухня с барной стойкой, гостиная с ТВ-зоной, гардеробная за рифлёным стеклом, детская с рабочим местом, спальня, два санузла и прихожая.</p>
      </div>
      <div style="flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
        <span style="font-size: 14px; color: #a39a8e">Стоимость проекта</span>
        <span style="font-size: 34px; font-weight: 500; line-height: 1.1; color: {{accent}}; white-space: nowrap">2 300 000 ₽</span>
        <span style="font-size: 13px; color: #8f867a">Цена актуальна на {{priceDate}}</span>
      </div>
      <div style="flex: 1 1 100%">
        <sc-if value="{{hasDesigner}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 12px; border-top: 1px solid #26221f; padding-top: 16px">
            <img src="{{designer.face}}" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block; flex: none">
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #a39a8e">Дизайнер проекта</span><span style="font-size: 16px; font-weight: 500">{{designer.name}}</span></span>
          </div>
        </sc-if>
      </div>
    </div>
  </section>
  </sc-if>

  <!-- лента -->
  <div class="pad" style="padding: 0 12px 64px">
    <div class="feed" style="display: flex; gap: 16px; align-items: stretch; max-width: {{maxW}}; margin: 0 auto">
      <sc-for list="{{columns}}" as="col" hint-placeholder-count="4">
      <div class="feed-col" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <sc-for list="{{col.pins}}" as="p" hint-placeholder-count="3">

        <!-- фото -->
        <sc-if value="{{p.isPhoto}}" hint-placeholder-val="{{ true }}">
          <div class="pin" style="position: relative; flex: 1 0 auto">
            <div aria-hidden="true" style="padding-top: {{p.padTop}}"></div>
            <button class="pin-btn" onClick="{{p.open}}" aria-label="Открыть фото: {{p.zone}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: block; width: 100%; height: 100%; padding: 0; border: 0; border-radius: 18px; overflow: hidden; background: #1f1c19; cursor: zoom-in">
              <img class="pin-img" src="{{p.src}}" loading="lazy" decoding="async" alt="{{p.zone}}" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: {{p.pos}}">
              <span class="pin-meta" style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <span style="height: 32px; box-sizing: border-box; display: inline-flex; align-items: center; background: rgba(255,255,255,0.95); color: #1c1a17; font-size: 13px; font-weight: 500; padding: 0 12px; border-radius: 999px">{{p.zone}}</span>
                <span style="width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.94); color: #1c1a17; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></span>
              </span>
            </button>
          </div>
        </sc-if>

        <!-- карточка зоны -->
        <sc-if value="{{p.isZone}}" hint-placeholder-val="{{ false }}">
          <div class="pin" style="border-radius: 18px; background: #f4f1ec; color: #1c1a17; padding: 26px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
            <span style="font-size: 13px; color: {{accent}}; letter-spacing: 0.08em">{{p.num}}</span>
            <span style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 30px; font-weight: 300; line-height: 1.1">{{p.zone}}</span>
              <span style="font-size: 14px; color: #b3aa9e">{{p.countLabel}}</span>
            </span>
          </div>
        </sc-if>

        <!-- видео -->
        <sc-if value="{{p.isVideo}}" hint-placeholder-val="{{ false }}">
          <div class="pin" style="position: relative; flex: none; border-radius: 18px; overflow: hidden; background: #1f1c19; padding-top: 177.78%">
            <img class="vid-ph" src="{{p.ph}}" alt="" aria-hidden="true" decoding="async" style="position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; object-fit: cover">
            <video class="feed-v" data-src="{{p.src}}" preload="none" autoplay="" muted="" loop="" playsinline="" style="pointer-events: none; position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; object-fit: cover"></video>
            <span style="position: absolute; left: 12px; top: 12px; height: 32px; box-sizing: border-box; display: inline-flex; align-items: center; background: rgba(255,255,255,0.94); color: #1c1a17; font-size: 13px; font-weight: 500; padding: 0 12px; border-radius: 999px; letter-spacing: 0.04em">REELS</span>
            <button onClick="{{p.open}}" aria-label="Открыть REELS" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: pointer">
              <span style="position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.94); color: #1c1a17; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></span>
            </button>
          </div>
        </sc-if>

        <!-- карточка о проекте -->
        <sc-if value="{{p.isAbout}}" hint-placeholder-val="{{ false }}">
          <div class="pin" style="border-radius: 18px; background: #1b1916; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
            <span style="font-size: 13px; color: #a39a8e; letter-spacing: 0.08em; text-transform: uppercase">О проекте</span>
            <p style="margin: 0; font-size: 17px; line-height: 1.55">Светлая квартира, где мебель почти растворяется в стенах: белые матовые фасады без ручек, шкафы до потолка, тёплый дуб в полу и мебели. П-образная кухня с барной стойкой, гостиная с ТВ-зоной, гардеробная за рифлёным стеклом, детская с рабочим местом, спальня, два санузла и прихожая.</p>
            <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; border-top: 1px solid #26221f; padding-top: 16px">
              <span style="font-size: 14px; color: #a39a8e">Стоимость проекта</span>
              <span style="font-size: 30px; font-weight: 500; line-height: 1.1; color: {{accent}}; white-space: nowrap">2 300 000 ₽</span>
              <span style="font-size: 13px; color: #8f867a">Цена актуальна на {{priceDate}}</span>
            </div>
            <sc-if value="{{hasDesigner}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; align-items: center; gap: 12px; border-top: 1px solid #26221f; padding-top: 16px">
                <img src="{{designer.face}}" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block; flex: none">
                <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #a39a8e">Дизайнер проекта</span><span style="font-size: 16px; font-weight: 500">{{designer.name}}</span></span>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <!-- карточка дизайнера -->
        <sc-if value="{{p.isDesigner}}" hint-placeholder-val="{{ false }}">
          <div id="designer" class="pin" style="border-radius: 18px; background: #1b1916; overflow: hidden; display: flex; flex-direction: column">
            <div style="position: relative; aspect-ratio: 4 / 5; background: #f4f1ec">
              <img loading="lazy" decoding="async" src="{{designer.photo}}" alt="{{designer.name}}, дизайнер проекта" style="display: block; width: 100%; height: 100%; object-fit: cover">
              <span style="position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,0.95); color: #1c1a17; font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 999px">Дизайнер проекта</span>
            </div>
            <div style="padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 12px">
              <span style="font-size: 26px; font-weight: 500; line-height: 1.15">{{designer.name}} Соколов</span>
              <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #cfc7bb">8 лет проектирует корпусную мебель, за плечами больше 300 квартир. Любит, когда мебель встраивается в архитектуру и не спорит с ней.</p>
              <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #cfc7bb; font-style: italic">«Хотелось тепла без лишнего декора — всю работу здесь делают материалы, свет и тонкие чёрные линии.»</p>
              <a href="#calc" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-height: 46px; margin-top: 4px; border-radius: 999px; border: 1px solid #f4f1ec; font-weight: 500; font-size: 15px">Обсудить проект с Кириллом</a>
            </div>
          </div>
        </sc-if>

        <!-- агитационный блок «Почему выбирают нас» -->
        <sc-if value="{{p.isPromo}}" hint-placeholder-val="{{ false }}">
          <div class="pin" style="position: relative; flex: none; border-radius: 18px; overflow: hidden; background: #1f1c19">
            <div aria-hidden="true" style="padding-top: 125%"></div>
            <img loading="lazy" decoding="async" src="{{promoImg}}" alt="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block">
            <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, rgba(12,11,10,0.92) 0%, rgba(12,11,10,0.55) 45%, rgba(12,11,10,0.15) 100%)"></div>
            <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 22px; display: flex; flex-direction: column; gap: 12px">
              <span style="height: 32px; box-sizing: border-box; align-self: flex-start; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; background: {{accent}}; color: #1c1a17; font-size: 13px; font-weight: 500">MGS Mebel</span>
              <span style="font-size: 26px; font-weight: 700; line-height: 1.08; letter-spacing: 0.01em; text-transform: uppercase; color: #f4f1ec">Почему выбирают именно нас?</span>
              <span style="font-size: 14px; line-height: 1.5; color: #d8d0c4">Своё производство в Москве, изготовление от 30 дней и гарантия 5 лет на корпус и фурнитуру.</span>
              <a href="{{promoLink}}" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; margin-top: 4px; border-radius: 999px; background: {{accent}}; color: #1c1a17; font-weight: 500; font-size: 15px">Узнать больше<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
