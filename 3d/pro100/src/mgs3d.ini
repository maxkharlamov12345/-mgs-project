; Настройки плагина MGS 3D для PRO100 (лежит рядом с mgs3d.plg)
[export]
; 1 — копировать текстуры, 0 — нет
copy_textures=1
; 1 — отправлять только выделенное в PRO100, 0 — весь проект
selection_only=0
; 1 — добавить стены помещения, 0 — без стен
add_walls=1
; 1 — плагин сам заполняет окна экспорта PRO100, 0 — заполняете вручную
auto_fill=1
; 1 — не проверять версию PRO100 (только если плагин пишет, что версия не поддерживается)
skip_version_check=0

