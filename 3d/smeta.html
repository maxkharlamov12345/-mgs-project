<style>@font-face{font-family:Onest;font-style:normal;font-weight:100 900;font-display:swap;src:url(../assets/fonts/onest-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-style:normal;font-weight:100 900;font-display:swap;src:url(../assets/fonts/onest-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}</style>
<style>
/* Смета (Макс 13.11) — прототип 2 с холста: 5 групп-аккордеонов, каталог по уровням, подбор фасадов по шагам, справа — что видит клиент.
   Стиль CRM: тёплый чёрный, таблетки, лайм — только главное. Цены здесь только клиентские (cat_view). */
:root{--bg:#0f0e0c;--surface:#151311;--surface2:#1b1916;--field:#1f1c19;--raised:#2a2622;--ink:#f4f1ec;--ink2:#d8d3ca;--ink3:#a8a196;--ink4:#8f897f;
  --lime:#bfd630;--on-lime:#0f0e0c;--line:#24211d;--red:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

.pill:hover{background:var(--raised)}.pill.on{background:var(--ink);color:var(--bg);font-weight:600}
.pill.lime{background:var(--lime);color:var(--on-lime);font-weight:600}.pill.dash{background:transparent;box-shadow:inset 0 0 0 1px #4a453e;color:var(--ink3)}
.pill:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.pill[disabled]{opacity:.45;pointer-events:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:18px max(28px,env(safe-area-inset-left)) 8px}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink3)}
.title{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:2px}
.title .sub{color:var(--ink3);font-size:13px}
.title input{all:unset;font-size:28px;font-weight:300;letter-spacing:-.01em;min-width:0}
.title input:focus{box-shadow:0 1px 0 var(--lime)}
.vars{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vars .pill{height:44px}

main{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding:10px max(28px,env(safe-area-inset-left)) 60px}

.gh .t span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh .th{display:flex;gap:4px}.gh .th i{width:26px;height:26px;border-radius:7px;background:#2a2622 center/cover}

.search{position:relative}

.rb{all:unset;cursor:pointer;width:42px;height:42px;border-radius:21px;background:var(--field);display:grid;place-items:center;color:var(--ink3);font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;max-height:68vh;overflow:auto;padding:2px}

.card .im.no{background:transparent;border:1.5px dashed #3a352f}
.card .tx{display:flex;flex-direction:column;gap:4px;min-width:0}.card .tx b{font-weight:400;line-height:1.3}.card .tx span{font-size:13px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;max-height:60vh;overflow:auto;padding:2px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:14px}
.tile.on{background:var(--raised);box-shadow:0 0 0 2px var(--lime)}
.tile i{display:block;aspect-ratio:1/1;border-radius:10px;background:#fff center/cover}
.tile b{font-weight:400;font-size:12px;line-height:1.25}.tile span{font-size:11px;color:var(--ink3)}
.steps{display:flex;flex-wrap:wrap;gap:6px}.steps button{all:unset;cursor:pointer;height:38px;padding:0 14px;border-radius:19px;font-size:13px;background:#1a1714;color:var(--ink4);display:inline-flex;align-items:center}
.steps button.done{background:var(--raised);color:var(--ink)}.steps button.cur{background:var(--lime);color:var(--on-lime);font-weight:600}
.opt{display:flex;flex-direction:column;gap:8px}.opt>span{font-size:13px;color:var(--ink3)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.ob{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:10px 16px;border-radius:16px;background:var(--field)}
.ob small{font-size:11px;color:var(--ink3)}.ob.on{background:var(--ink);color:var(--bg);font-weight:600}.ob.on small{color:#4a453e}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mat{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:18px;background:#1d1a17}
.mat.on{box-shadow:0 0 0 2px var(--lime)}.mat i{display:block;height:84px;border-radius:12px;background:#2a2622 center/cover}.mat span{font-size:12px;color:var(--ink3)}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:16px}
.foot .ph{width:44px;height:44px;border-radius:10px;background:#2a2622 center/cover}
.foot .d{flex:1 1 280px;display:flex;flex-direction:column;gap:2px}.foot .d span{font-size:12px;color:var(--ink3)}
.calc{background:#1d1a17;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.calc div{display:flex;justify-content:space-between;gap:10px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink3)}
.fld input{height:48px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1px #3a352f;background:var(--field);padding:0 14px;font-size:16px}
.edge{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:#1a1c12;box-shadow:inset 0 0 0 1px var(--lime);font-size:13px}
.r-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.r-line span:first-child{color:var(--ink2);line-height:1.35}.r-line span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.r-h{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
.r-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink3)}
.r-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:6px;border-top:1px solid #2c2824}
.r-total b{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums}
.dc{display:flex;gap:6px;align-items:center}.dc button{all:unset;cursor:pointer;height:32px;padding:0 12px;border-radius:16px;background:var(--field);color:var(--ink2);font-size:13px}
.dc button.on{background:var(--ink);color:var(--bg)}.dc input{width:52px;height:32px;border-radius:16px;border:0;background:var(--field);text-align:center}
.msg{color:var(--ink3);font-size:13px}.msg.err{color:var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;z-index:50}
.psearch{position:relative}.psearch input{width:100%;height:46px;border-radius:23px;border:0;box-shadow:inset 0 0 0 1px #3a352f;background:var(--field);padding:0 18px 0 42px;color:var(--ink);font-size:15px}
.psearch svg{position:absolute;left:16px;top:15px}
.tile i.no{background:transparent;border:1.5px dashed #3a352f;display:grid;place-items:center}.nop{font-size:11px;color:var(--ink4)}
.card.on{box-shadow:0 0 0 2px var(--lime)}.card .im.stack{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px;overflow:hidden}.card .im.stack i{border-radius:6px;background:#2a2622 center/cover}.card .im.stack i:first-child{grid-row:span 2}
.edge2{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:16px;background:#1a1c12;box-shadow:inset 0 0 0 1px var(--lime)}.edge2>b{color:var(--lime);font-weight:500}
.im.logo,.badge.logo{display:grid;place-items:center;background:#fff!important;padding:0;box-sizing:border-box;overflow:hidden}.im.logo.dk,.badge.logo.dk{background:#1d1a17!important;box-shadow:inset 0 0 0 1px #2c2824}
.im.logo img,.badge.logo img{width:100%;height:100%;object-fit:cover}.card .im.fill{background-size:cover;background-position:center}
.mat i{position:relative}.mat .badge{position:absolute;left:8px;bottom:8px;width:76px;height:34px;border-radius:9px}.mat .badge img{object-fit:contain}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.brands .b{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:#1d1a17}
.brands .b .im{width:100%;height:70px;border-radius:12px}.brands .b .row{display:flex;gap:6px;align-items:center}.brands input[type=text]{flex:1;min-width:0;height:34px;border-radius:10px;border:0;background:var(--field);padding:0 10px;font-size:12px}
.tree{display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:14px;background:#1a1714}
.tn .tl{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;cursor:default;user-select:none}
.tn .tl[draggable="true"]{cursor:grab}.tn .tl:hover{background:#24211d}.tn .tl.over{background:#2c3115;box-shadow:inset 0 0 0 1.5px var(--lime)}
.tn .tw{width:14px;color:var(--ink4);cursor:pointer;transition:transform .15s;display:inline-block}.tn.open>.tl .tw{transform:rotate(90deg)}
.tn .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tn .tt input{width:100%;height:28px;border-radius:8px;border:0;background:var(--field);padding:0 8px}
.tn .tc{font-size:12px;color:var(--ink4);font-variant-numeric:tabular-nums}
.t-s>.tl{font-weight:600;font-size:15px;cursor:pointer}.tk{padding-left:18px;border-left:1px solid #2c2824;margin-left:16px}
.t-g>.tl .tt{font-weight:500}.t-i>.tl{font-size:13px;color:var(--ink2);padding:4px 10px}
.tadd{all:unset;cursor:pointer;font-size:12px;color:var(--lime);padding:6px 10px}
table.mk{width:100%;border-collapse:collapse}table.mk td{padding:8px 6px;border-bottom:1px solid var(--line)}table.mk input{width:80px;height:36px;border-radius:10px;border:0;background:var(--field);text-align:center}

<body>
<header>
  <a class="back" id="back" href="crm.html"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>Карточка клиента</a>
  <div class="title"><span class="sub" id="who">Загрузка…</span><input id="ttl" aria-label="Название сметы" value="Смета"></div>
  <div class="vars" id="vars"></div>
  <span class="saved" id="saved"></span>
  <button class="pill" id="admBtn" hidden>Каталог и наценки</button>
</header>
<div class="msg err" id="err" hidden style="padding:0 28px"></div>
<main id="app" hidden>
  <div class="left" id="left"></div>
  <aside class="right" id="right"></aside>
</main>
<main id="adm" hidden></main>
<script src="lib/supabase.min.js"></script>
<script type="module">
import {sb,configured} from './db.js?v=20261112c';
import {SUPABASE_URL} from './config.js?v=20261112c';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=n=>Math.round(n||0).toLocaleString('ru-RU')+' ₽';
const nfmt=n=>String(Math.round((n||0)*100)/100).replace('.',',');
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200);};
const showErr=e=>{const b=$('#err');b.hidden=!e;b.textContent=e?('Ошибка: '+(e.message||e)):'';};
const ASSET=p=>p?('../'+p):'';

const GROUPS=[['Корпус и фасады',['Корпус','Задние стенки','Фасады','Кромка']],
  ['Фурнитура',['Петли','Ящики и направляющие','Подъёмники','Ручки и толкатели','Опоры']],
  ['Столешница и стены',['Столешница','Стеновые панели','Цоколь и водоотбойник']],
  ['Системы и наполнение',['Алюминиевые системы','Стекло и зеркала','Наполнение кухни','Наполнение шкафа','Подсветка и электрика']],
  ['Прочее и работы',['Мягкие панели','Декор','Услуги фабрики','Работы']]];
const SECS=GROUPS.flatMap(g=>g[1]);
const S={cat:[],byId:{},role:'',smeta:null,client:null,data:null,openGroup:0,open:null,q:'',found:[],saveT:0};

if(!configured)document.body.innerHTML='<p style="padding:40px">База не настроена.</p>';else init();
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.replace('crm.html');return;}
  try{const r=await fetch(SUPABASE_URL+'/admin/v1/me',{headers:{Authorization:'Bearer '+session.access_token}});if(r.ok)S.role=(await r.json()).role||'';}catch{}
  $('#admBtn').hidden=S.role!=='owner';$('#admBtn').onclick=()=>openAdmin();
  const p=new URLSearchParams(location.search);
  if(p.get('admin')&&S.role==='owner'){await loadCat();openAdmin();return;}
  const id=p.get('s');if(!id){$('#who').textContent='Смета не указана';return;}
  const [sm,_]=await Promise.all([sb.from('smetas').select('*').eq('id',id).single(),loadCat()]);
  if(sm.error){showErr(sm.error);return;}
  S.smeta=sm.data;
  const c=await sb.from('clients').select('id,num,name,phone').eq('id',S.smeta.client_id).single();S.client=c.data||{};
  $('#back').href='crm.html?c='+S.smeta.client_id;
  $('#who').textContent=[S.client.num,S.client.name].filter(Boolean).join(' · ');
  $('#ttl').value=S.smeta.title||'Смета';$('#ttl').oninput=()=>{S.smeta.title=$('#ttl').value;save();};
  S.data=S.smeta.data&&S.smeta.data.variants?S.smeta.data:{cur:0,variants:[{name:'Вариант A',disc:0,lines:[]}]};
  $('#app').hidden=false;render();
}
async function loadCat(){
  const all=[];for(let from=0;;from+=1000){const {data,error}=await sb.from('cat_view').select('id,kind,sec,grp,name,unit,params,photo,cprice,sort,gsort,sec0,grp0,sub0').neq('kind','search').order('sec').order('grp').order('sort').order('name').range(from,from+999);
    if(error){showErr(error.code==='42P01'?'каталог ещё не создан на сервере — подождите минуту и обновите страницу':error);break;}all.push(...data);if(data.length<1000)break;}
  S.cat=all;S.byId=Object.fromEntries(all.map(x=>[x.id,x]));
  const br=await sb.from('brands').select('key,logo,dark');S.brands=Object.fromEntries((br.data||[]).filter(x=>x.logo).map(x=>[x.key,x]));
  if(!all.length&&S.role==='owner')showErr('Каталог пуст — загрузите файл каталога: кнопка «Каталог и наценки».');
}
const V=()=>S.data.variants[S.data.cur];
const uid=()=>Math.random().toString(36).slice(2,10);
const lineSum=l=>(l.price||0)*(l.qty||0);
const varTotal=v=>{const t=v.lines.reduce((a,l)=>a+lineSum(l),0);return t*(1-(v.disc||0)/100);};
function save(){clearTimeout(S.saveT);$('#saved').textContent='Сохраняем…';S.saveT=setTimeout(async()=>{
  const {error}=await sb.from('smetas').update({title:S.smeta.title,data:S.data,total:Math.round(varTotal(V()))}).eq('id',S.smeta.id);
  $('#saved').textContent=error?'Не сохранилось':'Сохранено';if(error)showErr(error);},700);}
const setLines=f=>{V().lines=f(V().lines);save();render();};

function render(){renderVars();S.open?renderPanel():renderLeft();renderRight();}
function renderVars(){
  const el=$('#vars');
  el.innerHTML=S.data.variants.map((v,i)=>`<button class="pill ${i===S.data.cur?'on':''}" data-v="${i}">${esc(v.name)} · <span class="num">${rub(varTotal(v))}</span></button>`).join('')
    +`<button class="pill dash" id="vCopy">+ копией</button>`+(S.data.variants.length>1?`<button class="pill dash" id="vDel" title="Удалить текущий вариант">Удалить вариант</button>`:'');

  $('#vCopy').onclick=()=>{const v=JSON.parse(JSON.stringify(V()));v.name='Вариант '+'ABCDEFGHIJ'[S.data.variants.length];S.data.variants.push(v);S.data.cur=S.data.variants.length-1;save();render();};
  $('#vDel')&&($('#vDel').onclick=()=>{if(!confirm(`Удалить «${V().name}»?`))return;S.data.variants.splice(S.data.cur,1);S.data.cur=0;save();render();});

const phStyle=l=>l.th?.photo?`style="background-image:url('${esc(ASSET(l.th.photo))}')"`:l.th?.hex?`style="background:${esc(l.th.hex)}"`:'';

    const used=secs.filter(s=>L.some(l=>l.sec===s));

    const th=[...new Map(filled.filter(l=>l.th).map(l=>[JSON.stringify(l.th),l])).values()].slice(0,4);

      <span class="th">${th.map(l=>`<i ${phStyle(l)}></i>`).join('')}</span><span class="cnt">${filled.length?filled.length+' поз.':'пусто'}</span><span class="sum num">${sum?rub(sum):''}</span></div>
      <div class="gb">${secs.map(s=>{const ls=L.filter(l=>l.sec===s);return ls.length?`<div class="sec"><div class="sh"><span>${s}</span><button class="lnk" data-add="${esc(s)}">+ ещё</button></div>
        ${ls.map(lineHtml).join('')}</div>`:`<div class="sec empty"><div class="sh"><span>${s}</span></div><button class="addpl" data-add="${esc(s)}"><i>+</i>Выбрать из каталога</button></div>`;}).join('')}</div></div>`;
  }).join('');
  $('#left').innerHTML=html+`<div class="search"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a196" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="Найти позицию во всех прайсах (и Hettich)…" value="${esc(S.q)}" autocomplete="off"><div id="found"></div></div>`;
  const left=$('#left');
  left.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const l={id:uid(),sec:b.dataset.add,price:0,qty:0};V().lines.push(l);openFor(l);});
  left.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const l=V().lines.find(x=>x.id===b.dataset.open);if(l&&!l.auto)openFor(l);});
  left.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>setLines(L=>L.filter(x=>x.id!==b.dataset.del&&x.parent!==b.dataset.del)));
  left.querySelectorAll('[data-qty]').forEach(i=>i.oninput=()=>{const l=V().lines.find(x=>x.id===i.dataset.qty);const n=parseFloat(i.value.replace(/\s/g,'').replace(',','.'));
    l.qtyTxt=i.value;l.qty=isNaN(n)?0:n;save();const row=i.closest('.ln');row.querySelector('.s').textContent=l.price?rub(lineSum(l)):'—';renderRight();renderVars();});
  const q=$('#q');q.oninput=()=>{S.q=q.value;clearTimeout(S.qt);S.qt=setTimeout(search,250);};

function lineHtml(l){
  const e=!l.price;
  return `<div class="ln"><button class="open" data-open="${l.id}"><span class="ph ${l.auto?'auto':e?'empty':''}" ${phStyle(l)}></span>
    <span class="nm"><b class="${e?'pick':''}">${e?'Выбрать из каталога…':esc(l.name)}</b><span class="${l.auto?'auto':''}">${esc(l.decor||'')}</span></span></button>
    ${e?'<span class="s">—</span>':`<label class="q"><input data-qty="${l.id}" value="${esc(l.qtyTxt??nfmt(l.qty))}" inputmode="decimal" aria-label="Количество"><span>${esc(l.unit||'')}</span></label><span class="s">${rub(lineSum(l))}</span>`}

function renderRight(){
  const v=V(),L=v.lines.filter(l=>l.price);const sum=L.reduce((a,l)=>a+lineSum(l),0),ds=sum*(v.disc||0)/100;

  $('#dIn').onchange=()=>{const n=parseFloat($('#dIn').value.replace(',','.'));V().disc=isNaN(n)?0:Math.max(0,Math.min(100,n));save();render();};
  $('#toKp').onclick=async()=>{const {error}=await sb.from('clients').update({kp_sum:Math.round(sum-ds)}).eq('id',S.smeta.client_id);error?showErr(error):toast('Сумма КП записана в карточку клиента');};
}

/* ---------- поиск по всем прайсам ---------- */
async function search(){
  const q=S.q.trim();if(q.length<2){S.found=[];$('#found').innerHTML='';return;}
  const words=q.split(/\s+/).filter(Boolean).slice(0,4);
  let r=sb.from('cat_view').select('id,kind,sec,grp,name,unit,params,photo,cprice').not('cprice','is',null);
  words.forEach(w=>r=r.ilike('name','%'+w.replace(/[%_]/g,'')+'%'));
  const {data,error}=await r.limit(40);if(error)return showErr(error);
  S.found=data||[];showFound();
}
function guessSec(x){if(x.kind!=='search')return x.sec;const n=x.name.toLowerCase();
  return /петл|sensys|intermat|monteur/.test(n)?'Петли':/ящик|направл|innotech|actro|quadro|atira|avantech|arcitech/.test(n)?'Ящики и направляющие':/lift|подъ|klassik|wl /.test(n)?'Подъёмники':'Наполнение шкафа';}
function showFound(){
  $('#found').innerHTML=S.found.length?`<div class="found">${S.found.map(x=>`<button data-f="${x.id}"><span>${esc(x.name)}<br><small>${esc(guessSec(x))} · ${esc(x.grp)}</small></span><span class="num">${rub(x.cprice)} / ${esc(x.unit||'')}</span></button>`).join('')}</div>`:'<div class="msg" style="padding:8px 16px">Ничего не нашли</div>';
  $('#found').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const x=S.found.find(y=>y.id===b.dataset.f);const sec=guessSec(x);
    V().lines.push({id:uid(),sec,item:x.id,name:x.name,decor:'',qty:1,unit:x.unit,price:x.cprice,th:x.photo?{photo:x.photo}:null});
    S.q='';S.found=[];S.openGroup=GROUPS.findIndex(g=>g[1].includes(sec));save();render();toast('Добавлено в «'+sec+'»');});
}

/* ---------- каталог раздела и подбор плит (Макс 13.11, версия 2) ----------
   Плитные материалы (Корпус, Задние стенки, Фасады): Материал → Толщина → Категория → Декор → Площадь и кромка.
   Декоры — из «Соответствия декоров» фабрики по категориям и толщинам, фото — с сайта фабрики (kind decor, params.fam/cat).
   Цена — kind plate (fam, thick, cat). Где цена без кромки — на последнем шаге сразу кромка и её метры.
   Поиск — на каждом шаге (#ps). */
/* ---------- логотипы брендов (Макс 13.11): ключ бренда по названию группы / семейству плит; свои — assets/cat/brand, остальные — таблица brands (грузит главный) ---------- */
const BRANDS=[['mgs','MGS',/^MGS|Leonardo|Dante|REGO|SPACE|DECCO|Smartcube|Рамочные TW/i],['blum','Blum',/blum/i],['hettich','Hettich',/hettich/i],['boyard','Boyard / GTV',/boyard|gtv/i],
  ['firmax','FIRMAX',/firmax/i],['kessebohmer','Kessebohmer',/kesseb/i],['egger','EGGER',/egger/i],['alvic','ALVIC',/alvic|syncron/i],['agt','AGT',/^agt/i],['tss','TSS / Cleaf',/tss|cleaf/i],
  ['fenix','FENIX',/fenix/i],['arpa','ARPA',/arpa/i],['wilsonart','Wilsonart',/wilsonart/i],['dollken','Döllken',/dollken|döllken/i],['kedr','КЕДР',/кедр/i],['slavyanka','Славянка',/славянка/i],
  ['sonatti','SONATTI',/sonatti/i],['bramek','BRAMEK',/bramek/i]];
const OWN_LOGO={mgs:{logo:'assets/cat/brand/mgs.webp',dark:true},blum:{logo:'assets/cat/brand/blum.webp',dark:true},hettich:{logo:'assets/cat/brand/hettich.webp',dark:true}};
const FAM_BRAND={egger16:'egger',egger18:'egger',eggerps:'egger',eggersmart:'egger',alvic:'alvic',agt:'agt',tss:'tss',arpa:'arpa',ldsp:'mgs',hdf:'mgs',dvp:'mgs',pvc:'mgs',emal:'mgs'};
const brandOf=g=>(BRANDS.find(b=>b[2].test(g||''))||[])[0];
const grpOrder=items=>{const f={};items.forEach(x=>{const k=x.gsort!=null?x.gsort:1e9+x.sort;if(!(x.grp in f)||k<f[x.grp])f[x.grp]=k;});return f;};
const grpIcon=(sec,g,sub)=>{const m=x=>x.kind==='grp'&&x.params.grp===g&&(x.params.sub||null)===(sub||null);return (S.cat.find(x=>m(x)&&x.params.sec===sec)||S.cat.find(m))?.photo;};
const famIcon=f=>S.cat.find(x=>x.kind==='fam'&&x.params.fam===f)?.photo;
const catIcon=(f,k)=>S.cat.find(x=>x.kind==='famcat'&&x.params.fam===f&&+x.params.cat===+k)?.photo;
function logoOf(key){const b=key&&(S.brands?.[key]||OWN_LOGO[key]);return b&&b.logo?{src:/^https?:/.test(b.logo)?b.logo:ASSET(b.logo),dark:b.dark}:null;}
const logoTile=(l,cls='im')=>`<span class="${cls} logo ${l.dark?'dk':''}"><img src="${esc(l.src)}" alt="" loading="lazy"></span>`;

const FAMS={
  egger16:{l:'ЛДСП EGGER 16 / 32 мм',sub:'5 категорий · 16 мм с кромкой 1 мм',edge:{'32':['EGGER',/^(?!.*(Perfect|Smart))/]}},
  egger18:{l:'ЛДСП EGGER 18 / 36 мм',sub:'свои декоры · без кромки',edge:['EGGER',/^(?!.*(Perfect|Smart))/]},
  eggerps:{l:'EGGER PerfectSense 18 / 36 мм',sub:'древесные декоры · без кромки',edge:['EGGER',/Perfect Sense/]},
  eggersmart:{l:'МДФ EGGER PerfectSense Smart 18 мм',sub:'глянец и мат · без кромки',edge:['EGGER',/Smart/]},
  ldsp:{l:'ЛДСП MGS 16 / 32 мм',sub:'складская · 16 мм с кромкой 1 мм',edge:{'32':['DOLLKEN / ПВХ',/./]}},
  tss:{l:'TSS Cleaf / Smart',sub:'6 категорий · без кромки',edge:['TSS',/./]},
  alvic:{l:'ALVIC 18 мм',sub:'5 категорий · без кромки',edge:['ALVIC лазерная',/./],mill:true},
  agt:{l:'AGT 18 мм',sub:'6 категорий · без кромки',edge:['AGT',/./]},
  arpa:{l:'Пластик ARPA / FENIX / CLEAF',sub:'10 категорий · без кромки',edge:['FENIX',/./],sides:true},
  hdf:{l:'ХДФ 3 мм',sub:'ламинированная'},dvp:{l:'ДВП 4 мм',sub:'ламинированная'},
  emal:{l:'МДФ в эмали',sub:'RAL / NCS · фрезы'},pvc:{l:'МДФ в плёнке ПВХ',sub:'цвета MGS · фрезы'},other:{l:'Другое',sub:'остальные позиции раздела'}};
const SEC_FAMS={'Корпус':['egger16','egger18','eggerps','eggersmart','ldsp','tss','other'],'Задние стенки':['hdf','dvp','other'],
  'Фасады':['emal','pvc','egger16','egger18','eggerps','eggersmart','alvic','agt','tss','arpa','other']};
const DEC_FAM=x=>x.sec==='Стекло и зеркала'&&/^Стекло|Зеркал/.test(x.grp+' '+x.name)&&!/Обработ/.test(x.grp)?'glass':x.sec!=='Столешница'&&x.sec!=='Стеновые панели'?null:
  /HPL/.test(x.name)?'top_hpl':/Кварц/.test(x.name)?'top_quartz':/Керамик/.test(x.name)?'top_ceramic':/FENIX/.test(x.name)?'top_fenix':/ALVIC|SYNCRON/.test(x.name)?'top_alvic':null;
const decs=(fam,cat)=>S.cat.filter(x=>x.kind==='decor'&&x.params.fam===fam&&(cat==null||String(x.params.cat)===String(cat)));
const plates=fam=>S.cat.filter(x=>x.kind==='plate'&&x.params.fam===fam);
const thicksOf=(fam,s)=>[...new Set(plates(fam).filter(x=>!FAMS[fam].sides||+x.params.sides===+(s?.sides||1)).map(x=>x.params.thick))].sort((a,b)=>a-b);
const catsOf=(fam,th)=>[...new Set(plates(fam).filter(x=>x.params.cat!=null&&(!th||x.params.thick===String(th))).map(x=>+x.params.cat))].sort((a,b)=>a-b);
const plateRow=s=>plates(s.fam).find(x=>x.params.thick===String(s.thick)&&(x.params.cat==null||+x.params.cat===+s.cat)&&(!FAMS[s.fam].sides||+x.params.sides===+(s.sides||1)));
const norm=t=>String(t||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
const hit=(t,q)=>{const w=norm(q).split(' ').filter(Boolean);const n=norm(t);return w.every(x=>n.includes(x));};
const NOPH='<span class="nop">нет фото</span>';
const bgi=p=>p?`style="background-image:url('${esc(ASSET(p))}')"`:'';
function decTile(d,on,act,sub){return `<button class="tile ${on?'on':''}" data-act="${act}"><i class="${d.photo?'':'no'}" ${bgi(d.photo)}>${d.photo?'':NOPH}</i><b>${esc(d.name)}</b><span>${esc(sub??(d.params.cat!=null&&!isNaN(d.params.cat)?d.params.cat+' кат.':''))}</span></button>`;}
function edgeOpts(s){const f=FAMS[s.fam];if(!f?.edge)return null;const e=Array.isArray(f.edge)?f.edge:f.edge[String(s.thick)];if(!e)return null;
  return S.cat.filter(x=>x.sec==='Кромка'&&x.grp===e[0]&&e[1].test(x.name)&&x.cprice);}
const searchBox=(ph)=>`<div class="psearch"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a196" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="ps" placeholder="${esc(ph)}" value="${esc(S.open.q||'')}" autocomplete="off"></div>`;
function bindSearch(rerender){const i=$('#ps');if(!i)return;i.oninput=()=>{S.open.q=i.value;clearTimeout(S.pst);S.pst=setTimeout(()=>{rerender();const j=$('#ps');j.focus();j.setSelectionRange(j.value.length,j.value.length);},180);};}

function openFor(l){
  if(SEC_FAMS[l.sec]){const sp=l.spec&&l.spec.fam?JSON.parse(JSON.stringify(l.spec)):{fam:null,ex:{},area:l.qty||1,note:''};
    S.open={mode:'plate',id:l.id,sec:l.sec,step:sp.fam?99:0,spec:sp,q:''};}
  else S.open={mode:'pick',id:l.id,sec:l.sec,grp:null,q:''};
  render();window.scrollTo({top:0});
}
function renderPanel(){S.open.mode==='plate'?renderPlate():renderPick();}
function setLine(patch){const o=S.open;V().lines=V().lines.map(l=>l.id===o.id?{...l,qtyTxt:undefined,...patch}:l);S.open=null;save();render();}
const panel=(head,body,foot='')=>`<div class="panel"><div class="ph-h"><div class="l">${head}</div><button class="rb" id="pClose" aria-label="Закрыть">×</button></div>${body}${foot}</div>`;

/* --- обычные разделы: бренд/серия → позиции (→ декор у столешниц и стекла) --- */
function renderPick(){
  const o=S.open,items=S.cat.filter(x=>x.sec===o.sec&&(x.kind==='item'||x.kind==='price')&&x.cprice);
  /* порядок групп — как в файле каталога (по сайту фабрики), своя фурнитура фабрики (MGS) — первой */
  const first=grpOrder(items);
  const grps=Object.keys(first).sort((a,b)=>((/^MGS/.test(b)?1:0)-(/^MGS/.test(a)?1:0))||first[a]-first[b]);const acts={};/* своя фурнитура фабрики (MGS) — первой */let n=0;const A=f=>{const k='a'+(n++);acts[k]=f;return k;};
  const itemCard=x=>{const df=DEC_FAM(x);const ph=x.photo||(df&&decs(df)[0]?.photo)||grpIcon(o.sec,x.grp,x.params?.sub)||grpIcon(o.sec,x.grp)||(OWN_LOGO[brandOf(x.grp)]||{}).logo;return `<button class="card" data-act="${A(()=>pickItem(x))}"><span class="im ${ph?'':'no'}" ${bgi(ph)}>${ph?'':'нет фото'}</span>
    <span class="tx"><b>${esc(x.name)}</b><span>${rub(x.cprice)} / ${esc(x.unit||'')}${df?' · '+decs(df).length+' декоров':''}${o.grp?'':' · '+esc(x.grp)}</span></span></button>`;};
  let head,body;const q=o.q||'';
  if(o.item){const x=o.item,df=DEC_FAM(x);let ds=decs(df);if(q)ds=ds.filter(d=>hit(d.name+' '+d.params.code+' '+(d.params.cat||''),q));
    head=`<button class="rb" id="pBack" aria-label="Назад">‹</button><b>${esc(x.name)}</b><small>выберите декор</small>`;
    body=searchBox('Найти декор…')+`<div class="grid">${ds.map(d=>decTile(d,false,A(()=>finishItem(x,d)),df==='top_ceramic'?d.params.cat+' мм':df==='top_hpl'?d.params.cat:'')).join('')||'<span class="msg">Ничего не нашли</span>'}</div>
      <div><button class="pill" data-act="${A(()=>finishItem(x,null))}">Без декора — впишу сам</button></div>`;
  }else if(q){const its=items.filter(x=>hit(x.name+' '+x.grp,q));
    head=`<b>${esc(o.sec)}</b><small>поиск по разделу</small>`;body=searchBox('Найти в разделе «'+o.sec+'»…')+`<div class="cards">${its.map(itemCard).join('')||'<span class="msg">Ничего не нашли</span>'}</div>`;
  }else if(!o.grp){
    head=`<b>${esc(o.sec)}</b><small>выберите бренд или серию</small>`;
    body=searchBox('Найти в разделе «'+o.sec+'»…')+(grps.length?`<div class="cards">${grps.map(g=>{const its=items.filter(x=>x.grp===g),min=Math.min(...its.map(x=>x.cprice||1e12));const ph=its.find(x=>x.photo)?.photo;
      const gi=grpIcon(o.sec,g),lg=gi?null:logoOf(brandOf(g));

/* --- плиты и фасады --- */
const mills=()=>S.cat.filter(x=>x.kind==='mill');
const FP=f=>S.cat.find(x=>x.kind==='price'&&x.sec==='Фасады'&&f(x.params||{}));
function stepsOf(s){const f=s.fam;if(!f)return ['Материал'];if(f==='other')return ['Материал','Позиция'];
  if(f==='emal')return ['Материал','Толщина и покрытие','Фрезеровка','Цвет','Площадь'];
  if(f==='pvc')return ['Материал','Толщина и плёнка','Фрезеровка','Цвет','Площадь'];
  const st=['Материал'];if(thicksOf(f,s).length>1||FAMS[f].sides)st.push('Толщина');if(catsOf(f).length)st.push('Категория');if(FAMS[f].mill)st.push('Фрезеровка');
  st.push('Декор');st.push(edgeOpts(s)?'Площадь и кромка':'Площадь');return st;}
function specPrice(s){
  const rows=[];let base=null;
  if(s.fam==='emal')base=FP(p=>p.mat==='emal'&&p.thick===s.thick&&p.coat===s.coat&&p.mill===(s.mill?1:0));
  else if(s.fam==='pvc')base=FP(p=>p.mat==='pvc'&&p.thick===s.thick&&p.coat===s.coat);
  else if(s.fam&&s.fam!=='other')base=plateRow(s);
  if(!base)return {cp:0,rows:[],base:null};
  let cp=base.cprice;rows.push([base.name,base.cprice]);
  if(s.mill&&(s.fam==='emal'||s.fam==='pvc')){const m=S.byId[s.mill];const add=FP(p=>p.millcat===(m?.params.special?'special':m?.params.cat));if(add){cp+=add.cprice;rows.push([`Фреза ${m.params.code} (${m.params.special?'312–341':m.params.cat+' кат.'})`,add.cprice]);}}
  if(s.fam==='alvic'&&s.alvMill){const a=S.cat.find(x=>x.params?.alvmill);if(a){cp+=a.cprice;rows.push(['Фрезеровка ALVIC '+s.alvMill,a.cprice]);}}
  const ex=s.ex||{},b=base.cprice;
  if(ex.two){cp+=b*.5;rows.push([s.fam==='pvc'?'Плёнка с двух сторон +50%':'Две стороны +50%',b*.5]);}
  if(ex.twocolor){cp+=b*.5;rows.push(['Два цвета +50%',b*.5]);}
  if(ex.patina){const p=FP(q=>q.extra===(s.coat==='глянец'?'patina_gl':'patina_mat'));if(p){cp+=p.cprice;rows.push(['Патина',p.cprice]);}}
  if(ex.glitter){const p=FP(q=>q.extra==='glitter');if(p){cp+=p.cprice;rows.push(['Блёстки',p.cprice]);}}
  return {cp:Math.round(cp),rows,base};
}
function plateName(s){const m=s.mill?S.byId[s.mill]:null;

  if(s.fam==='pvc')return `МДФ ПВХ ${s.thick} мм, ${s.coat}${m?`, фреза ${m.params.code}`:', без фрезы'}`;
  const r=plateRow(s);return (r?r.name:FAMS[s.fam]?.l||'')+(s.alvMill?', '+s.alvMill:'');}

function plateThumb(s){const d=S.byId[s.decor];if(d?.photo)return {photo:d.photo};if(s.fam==='emal'&&S.byId[s.color])return {hex:S.byId[s.color].params.hex};if(s.mill&&S.byId[s.mill])return {photo:S.byId[s.mill].photo};return null;}
function defaults(fam,s){const o={fam,ex:{},area:s.area,note:s.note,areaTxt:s.areaTxt};

        <div style="border-top:1px solid #2c2824;padding-top:10px"><span id="cA">${nfmt(s.area)} м²</span><span class="num" id="cAs">${rub(pr.cp*s.area)}</span></div>
        ${eo?`<div><span id="cE">Кромка ${nfmt(s.edgeM||0)} м.п.</span><span class="num" id="cEs">${rub((S.byId[s.edge]?.cprice||0)*(s.edgeM||0))}</span></div>`:''}
        <div><b>Итого</b><b class="num" id="cT" style="font-size:20px;font-weight:400">${rub(pr.cp*s.area+(eo?(S.byId[s.edge]?.cprice||0)*(s.edgeM||0):0))}</b></div></div></div>`;
  }
  const pr=s.fam&&s.fam!=='other'?specPrice(s):{cp:0},th=s.fam?plateThumb(s):null,isLast=step===last;
  $('#left').innerHTML=panel(`<b>${esc(o.sec)} · подбор</b>`,`<div class="steps">${steps.map((t,i)=>`<button class="${i===step?'cur':i<step?'done':''}" data-st="${i}">${i+1} ${t}</button>`).join('')}</div>
    ${ph?searchBox(ph):''}<div>${body}</div>`,
    s.fam&&s.fam!=='other'?`<div class="foot"><span class="ph" style="${th?.photo?`background-image:url('${esc(ASSET(th.photo))}')`:th?.hex?'background:'+esc(th.hex):''}"></span>
      <span class="d"><b style="font-weight:400">${esc(plateName(s))}</b><span>${esc(plateDecor(s))}</span></span><span class="num">${pr.cp?rub(pr.cp)+' / м²':'—'}</span>
      <button class="pill" id="fPrev">Назад</button><button class="pill lime" id="fNext">${isLast?'Добавить в смету':'Далее'}</button></div>`:'');
  $('#pClose').onclick=()=>{S.open=null;render();};
  $('#left').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>acts[b.dataset.act]());
  $('#left').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{if(s.fam||+b.dataset.st===0){o.step=+b.dataset.st;o.q='';renderPlate();}});
  bindSearch(renderPlate);
  $('#cTxt')&&($('#cTxt').oninput=e=>{s.colorTxt=e.target.value;s.color=null;});
  $('#dTxt')&&($('#dTxt').oninput=e=>{s.decorTxt=e.target.value;if(e.target.value)s.decor=null;});
  $('#fNote')&&($('#fNote').oninput=e=>{s.note=e.target.value;});
  const num=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n;};
  const recalc=()=>{const p=specPrice(s).cp,ep=S.byId[s.edge]?.cprice||0,eo=edgeOpts(s);$('#cA').textContent=nfmt(s.area)+' м²';$('#cAs').textContent=rub(p*s.area);
    if(eo){$('#cE').textContent='Кромка '+nfmt(s.edgeM||0)+' м.п.';$('#cEs').textContent=rub(ep*(s.edgeM||0));}$('#cT').textContent=rub(p*s.area+(eo?ep*(s.edgeM||0):0));};
  $('#fArea')&&($('#fArea').oninput=e=>{s.areaTxt=e.target.value;s.area=num(e.target.value);recalc();});
  $('#fEdge')&&($('#fEdge').oninput=e=>{s.edgeTxt=e.target.value;s.edgeM=num(e.target.value);recalc();});
  $('#fPrev')&&($('#fPrev').onclick=()=>{if(step>0){o.step=step-1;o.q='';renderPlate();}else{S.open=null;render();}});
  $('#fNext')&&($('#fNext').onclick=()=>{
    if(!isLast){o.step=step+1;o.q='';renderPlate();return;}
    const p=specPrice(s);if(!p.cp){toast('Нет цены для этого сочетания — проверьте толщину и категорию');return;}
    const eo=edgeOpts(s),e=eo?S.byId[s.edge]:null,dec=plateDecor(s);
    V().lines=V().lines.filter(l=>l.parent!==o.id).flatMap(l=>{if(l.id!==o.id)return [l];
      const nl={...l,qtyTxt:undefined,name:plateName(s),decor:[dec,s.note].filter(Boolean).join(' · '),qty:s.area,unit:'м²',price:p.cp,th:plateThumb(s),spec:s};
      return e?[nl,{id:uid(),parent:o.id,auto:true,sec:'Кромка',item:e.id,name:'Кромка '+e.name,decor:'к «'+(S.byId[s.decor]?.name||plateName(s))+'»',qty:s.edgeM||0,unit:'м.п.',price:e.cprice}]:[nl];});
    S.open=null;save();render();});
}


/* ---------- главный: дерево каталога (Макс 13.11: «сам перетаскиваю в правильную структуру») ----------
   Перестановки — таблица cat_tree (миграция 015) поверх файла каталога; ключи по ИСХОДНЫМ sec0/grp0/sub0 позиции.
   Группа = все её исходные группы → правило 'grp:'; подгруппа → 'sub:'; позиция → 'item:'. Порядок групп — sort у правил 'grp:'. */
const TR={open:new Set(),drag:null,extra:{}};
const rk={g:x=>'grp:'+x.sec0+'|'+x.grp0,u:x=>'sub:'+x.sec0+'|'+x.grp0+'|'+(x.sub0||''),i:x=>'item:'+x.id};
async function trLoad(){const r=await sb.from('cat_tree').select('*');if(r.error){$('#trMsg').textContent='Структура не загрузилась: '+r.error.message;return null;}S.rules=Object.fromEntries((r.data||[]).map(x=>[x.key,x]));return S.rules;}
async function trSave(rows,msg){if(!rows.length)return;const now=new Date().toISOString();
  const {error}=await sb.from('cat_tree').upsert(rows.map(r=>({...r,updated_at:now})));if(error){$('#trMsg').textContent='Ошибка: '+error.message;return;}
  await loadCat();await drawTree();toast(msg||'Сохранено');}
function trItems(){return S.cat.filter(x=>x.kind==='item');}
async function drawTree(){
  if(!S.rules&&!(await trLoad()))return;
  const its=trItems(),bySec={};its.forEach(x=>((bySec[x.sec]??={})[x.grp]??=[]).push(x));
  Object.entries(TR.extra).forEach(([sec,gs])=>gs.forEach(g=>((bySec[sec]??={})[g]??=[])));
  const secs=[...SECS,...Object.keys(bySec).filter(x=>!SECS.includes(x))];
  const ord=(sec)=>{const gs=bySec[sec]||{},f=grpOrder(its.filter(x=>x.sec===sec));return Object.keys(gs).sort((a,b)=>(f[a]??1e12)-(f[b]??1e12));};
  const node=(t,attrs,label,cnt,inner,open)=>`<div class="tn t-${t} ${open?'open':''}" ${attrs}><div class="tl" draggable="${t!=='s'}"><span class="tw">${inner!=null?'▸':''}</span><span class="tt">${esc(label)}</span><span class="tc">${cnt}</span></div>${open&&inner!=null?`<div class="tk">${inner()}</div>`:''}</div>`;
  $('#tree').innerHTML=secs.map(sec=>{const gs=ord(sec),ks='s|'+sec;
    return node('s',`data-k="${esc(ks)}" data-sec="${esc(sec)}"`,sec,gs.length?gs.length+' гр.':'пусто',()=>gs.map(g=>{const gi=bySec[sec][g],kg='g|'+sec+'|'+g,subs=[...new Set(gi.map(x=>x.params?.sub).filter(Boolean))];
      return node('g',`data-k="${esc(kg)}" data-sec="${esc(sec)}" data-grp="${esc(g)}"`,g,gi.length+' поз.',()=>subs.map(u=>{const ui=gi.filter(x=>x.params?.sub===u),ku='u|'+sec+'|'+g+'|'+u;
          return node('u',`data-k="${esc(ku)}" data-sec="${esc(sec)}" data-grp="${esc(g)}" data-sub="${esc(u)}"`,u,ui.length+' поз.',()=>ui.map(x=>node('i',`data-id="${x.id}" data-sec="${esc(sec)}" data-grp="${esc(g)}" data-sub="${esc(u)}"`,x.name,rub(x.cprice))).join(''),TR.open.has(ku));}).join('')
        +gi.filter(x=>!x.params?.sub).map(x=>node('i',`data-id="${x.id}" data-sec="${esc(sec)}" data-grp="${esc(g)}"`,x.name,rub(x.cprice))).join(''),TR.open.has(kg));}).join('')
      +`<button class="tadd" data-addg="${esc(sec)}">+ новая группа</button>`,TR.open.has(ks));}).join('');
  const tree=$('#tree');
  tree.querySelectorAll('.tw').forEach(w=>w.onclick=e=>{const n=w.closest('.tn'),k=n.dataset.k;if(!k)return;TR.open.has(k)?TR.open.delete(k):TR.open.add(k);drawTree();});
  tree.querySelectorAll('.t-s>.tl .tt').forEach(t=>t.onclick=()=>{const k=t.closest('.tn').dataset.k;TR.open.has(k)?TR.open.delete(k):TR.open.add(k);drawTree();});
  tree.querySelectorAll('[data-addg]').forEach(b=>b.onclick=()=>{const sec=b.dataset.addg;let i=1;while(bySec[sec]?.['Новая группа '+i])i++;(TR.extra[sec]??=[]).push('Новая группа '+i);TR.open.add('s|'+sec);drawTree();});
  // переименование — двойной щелчок
  tree.querySelectorAll('.t-g>.tl .tt,.t-u>.tl .tt').forEach(t=>t.ondblclick=()=>{const n=t.closest('.tn'),old=t.textContent;t.innerHTML=`<input value="${esc(old)}">`;const i=t.querySelector('input');i.focus();i.select();
    const done=ok=>{const v=i.value.trim();if(!ok||!v||v===old){drawTree();return;}n.classList.contains('t-g')?moveGrp(n.dataset.sec,n.dataset.grp,n.dataset.sec,v):moveSub(n.dataset,{sec:n.dataset.sec,grp:n.dataset.grp,sub:v});};
    i.onkeydown=e=>{if(e.key==='Enter')done(true);if(e.key==='Escape')done(false);};i.onblur=()=>done(true);});
  // перетаскивание
  tree.querySelectorAll('.tl[draggable="true"]').forEach(l=>{l.ondragstart=e=>{const n=l.closest('.tn');TR.drag={...n.dataset,t:n.classList.contains('t-g')?'g':n.classList.contains('t-u')?'u':'i'};e.dataTransfer.setData('text/plain','x');e.dataTransfer.effectAllowed='move';};
    l.ondragend=()=>{TR.drag=null;tree.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));};});
  tree.querySelectorAll('.tl').forEach(l=>{const n=l.closest('.tn'),t=n.classList.contains('t-s')?'s':n.classList.contains('t-g')?'g':n.classList.contains('t-u')?'u':'i';
    const ok=()=>{const d=TR.drag;if(!d)return false;return (d.t==='g'&&(t==='s'||t==='g'))||(d.t==='u'&&(t==='g'||t==='s'||t==='u'))||(d.t==='i'&&(t==='g'||t==='u'));};
    l.ondragover=e=>{if(ok()){e.preventDefault();l.classList.add('over');}};l.ondragleave=()=>l.classList.remove('over');
    l.ondrop=e=>{e.preventDefault();l.classList.remove('over');const d=TR.drag,tg=n.dataset;if(!d||!ok())return;TR.drag=null;
      if(d.t==='g'&&t==='s')moveGrp(d.sec,d.grp,tg.sec,d.grp);
      else if(d.t==='g'&&t==='g')moveGrp(d.sec,d.grp,tg.sec,d.grp,tg.grp);
      else if(d.t==='u'&&t==='g')moveSub(d,{sec:tg.sec,grp:tg.grp,sub:d.sub});
      else if(d.t==='u'&&t==='u')moveSub(d,{sec:tg.sec,grp:tg.grp,sub:tg.sub});
      else if(d.t==='u'&&t==='s')moveSub(d,{sec:tg.sec,grp:d.sub,sub:null});
      else if(d.t==='i')moveItem(d.id,{sec:tg.sec,grp:tg.grp,sub:tg.sub||null});};});
}
// группа (итоговая) → в раздел sec2 под именем grp2; before — встать перед этой группой
async function moveGrp(sec,grp,sec2,grp2,before){
  const its=trItems(),gi=its.filter(x=>x.sec===sec&&x.grp===grp),rows=[],seen=new Set();
  gi.forEach(x=>{const k=rk.g(x);if(!seen.has(k)){seen.add(k);rows.push({key:k,sec:sec2,grp:grp2,sub:null,sort:S.rules[k]?.sort??null});}
    [rk.u(x),rk.i(x)].forEach(k=>{const r=S.rules[k];if(r&&!seen.has(k)){seen.add(k);rows.push({...r,sec:sec2,grp:grp2});}});});
  if(TR.extra[sec])TR.extra[sec]=TR.extra[sec].filter(g=>g!==grp);
  // порядок групп в разделе назначения
  const f=grpOrder(its.filter(x=>x.sec===sec2&&!(x.sec===sec&&x.grp===grp)));let order=Object.keys(f).sort((a,b)=>f[a]-f[b]).filter(g=>g!==grp2);
  const at=before?order.indexOf(before):-1;at<0?order.push(grp2):order.splice(at,0,grp2);
  order.forEach((g,ix)=>{its.filter(x=>x.sec===sec2&&x.grp===g).forEach(x=>{const k=rk.g(x);const r=rows.find(y=>y.key===k);if(r)r.sort=ix;else if(!seen.has(k)){seen.add(k);rows.push({key:k,sec:x.sec,grp:x.grp,sub:null,sort:ix});}});});
  rows.filter(r=>r.key.startsWith('grp:')&&r.sec===sec2&&r.grp===grp2).forEach(r=>r.sort=order.indexOf(grp2));
  await trSave(rows,before?'Группа переставлена':'Группа перенесена в «'+sec2+'»');}
async function moveSub(d,to){
  const gi=trItems().filter(x=>x.sec===d.sec&&x.grp===d.grp&&x.params?.sub===d.sub),rows=[],seen=new Set();
  gi.forEach(x=>{const k=rk.u(x);if(!seen.has(k)){seen.add(k);rows.push({key:k,sec:to.sec,grp:to.grp,sub:to.sub,sort:null});}const ki=rk.i(x);if(S.rules[ki]&&!seen.has(ki)){seen.add(ki);rows.push({...S.rules[ki],sec:to.sec,grp:to.grp,sub:to.sub});}});
  if(TR.extra[to.sec])TR.extra[to.sec]=TR.extra[to.sec].filter(g=>g!==to.grp);
  await trSave(rows,'Подгруппа перенесена');}
async function moveItem(id,to){const x=S.byId[id];if(!x)return;if(TR.extra[to.sec])TR.extra[to.sec]=TR.extra[to.sec].filter(g=>g!==to.grp);await trSave([{key:rk.i(x),sec:to.sec,grp:to.grp,sub:to.sub,sort:null}],'Позиция перенесена');}

/* ---------- главный: каталог и наценки ---------- */
async function openAdmin(){
  $('#app').hidden=true;$('#adm').hidden=false;$('#vars').innerHTML='';$('#ttl').value='Каталог и наценки';$('#ttl').disabled=true;
  const [mk,cnt]=await Promise.all([sb.from('markups').select('*'),sb.from('cat_items').select('id',{count:'exact',head:true})]);
  const M=Object.fromEntries((mk.data||[]).map(x=>[x.key,x.k]));
  $('#adm').innerHTML=`<div class="left"><div class="panel"><b style="font-size:20px;font-weight:500">Каталог</b>
      <span class="msg">Сейчас в каталоге: <b class="num" style="color:var(--ink)">${cnt.count??0}</b> позиций. Файл каталога (catalog.json) собирается из прайсов фабрики; с ценами фабрики — поэтому не лежит в репозитории, загружается здесь.</span>
      <label class="pill lime" style="align-self:flex-start">Загрузить файл каталога<input type="file" id="catFile" accept=".json" hidden></label><span class="msg" id="catMsg"></span></div>
    <div class="panel"><b style="font-size:20px;font-weight:500">Наценки</b><span class="msg">Цена клиенту = цена фабрики × наценка (до 10 ₽). Менеджеры видят только цену клиенту. Пусто — берётся наценка по умолчанию.</span>
      <table class="mk"><tr><td><b>По умолчанию</b></td><td><input data-k="*" value="${M['*']??1.8}"></td></tr>
      <tr><td>Плиты: корпус, фасады, стенки (EGGER, ALVIC, AGT, TSS, пластик…)</td><td><input data-k="sec:Плиты" value="${M['sec:Плиты']??''}" placeholder="—"></td></tr>
      ${SECS.map(s=>`<tr><td>${s}</td><td><input data-k="sec:${esc(s)}" value="${M['sec:'+s]??''}" placeholder="—"></td></tr>`).join('')}</table>
      <button class="pill lime" id="mkSave" style="align-self:flex-start">Сохранить наценки</button><span class="msg" id="mkMsg"></span></div>
    <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><b style="font-size:20px;font-weight:500">Структура каталога</b>
      <span style="display:flex;gap:8px"><button class="pill" id="trOpen">Развернуть всё</button><button class="pill dash" id="trReset">Вернуть как в файле</button></span></div>
      <span class="msg">Перетаскивайте мышью: группу — на раздел (перенос) или на другую группу (встанет перед ней); подгруппу — на группу; позицию — на группу или подгруппу.
        Двойной щелчок по названию группы или подгруппы — переименовать. Новая загрузка файла каталога перестановки не сбрасывает.</span>
      <div class="tree" id="tree"></div><span class="msg" id="trMsg"></span></div>
    <div class="panel"><b style="font-size:20px;font-weight:500">Логотипы брендов</b><span class="msg">Показываются в смете на плитках брендов и материалов. Загрузите файл (PNG, SVG, JPG) или вставьте адрес картинки. «Тёмная плитка» — для светлых логотипов.</span>
      <div class="brands" id="brands"></div></div></div>`;
  const drawBrands=()=>{$('#brands').innerHTML=BRANDS.map(([k,n])=>{const l=logoOf(k);return `<div class="b"><b style="font-weight:500">${esc(n)}</b>${l?logoTile(l):'<span class="im" style="display:grid;place-items:center;color:var(--ink4);font-size:12px">нет логотипа</span>'}
      <div class="row"><label class="pill" style="height:34px;padding:0 12px;font-size:12px">Файл<input type="file" accept="image/*,.svg" data-bf="${k}" hidden></label><input type="text" data-bu="${k}" placeholder="или адрес https://…" value="${esc(S.brands?.[k]?.logo&&/^https?:/.test(S.brands[k].logo)?S.brands[k].logo:'')}"></div>
      <label class="row" style="font-size:12px;color:var(--ink3)"><input type="checkbox" data-bd="${k}" ${l?.dark?'checked':''}> тёмная плитка</label></div>`;}).join('');
    const put=async(k,logo,dark)=>{const {error}=await sb.from('brands').upsert({key:k,logo,dark,updated_at:new Date().toISOString()});if(error)return toast('Ошибка: '+error.message);S.brands[k]={key:k,logo,dark};drawBrands();toast('Логотип сохранён');};
    document.querySelectorAll('[data-bf]').forEach(i=>i.onchange=async()=>{const f=i.files[0];if(!f)return;const k=i.dataset.bf,ext=(f.name.split('.').pop()||'png').toLowerCase();
      const path=`brand/${k}-${Date.now()}.${ext}`;const {error}=await sb.storage.from('media').upload(path,f,{contentType:f.type||(ext==='svg'?'image/svg+xml':'image/'+ext)});
      if(error)return toast('Не загрузилось: '+error.message);put(k,SUPABASE_URL+'/storage/v1/object/public/media/'+path,!!S.brands?.[k]?.dark);});
    document.querySelectorAll('[data-bu]').forEach(i=>i.onchange=()=>{const v=i.value.trim();if(v&&!/^https:\/\//.test(v))return toast('Нужен адрес https://…');put(i.dataset.bu,v||null,!!S.brands?.[i.dataset.bu]?.dark);});
    document.querySelectorAll('[data-bd]').forEach(i=>i.onchange=()=>{const k=i.dataset.bd,l=S.brands?.[k]?.logo||OWN_LOGO[k]?.logo;if(!l)return;put(k,l,i.checked);});};
  S.brands=S.brands||{};drawBrands();
  drawTree();
  $('#trOpen').onclick=()=>{const all=TR.open.size>3;TR.open.clear();if(!all){SECS.forEach(x=>TR.open.add('s|'+x));}drawTree();};
  $('#trReset').onclick=async()=>{if(!confirm('Вернуть структуру как в файле каталога? Все перестановки удалятся.'))return;const {error}=await sb.from('cat_tree').delete().neq('key','');if(error)return toast('Ошибка: '+error.message);S.rules={};await loadCat();drawTree();toast('Структура как в файле');};
  $('#mkSave').onclick=async()=>{const up=[],del=[];document.querySelectorAll('[data-k]').forEach(i=>{const v=parseFloat(i.value.replace(',','.'));v>0?up.push({key:i.dataset.k,k:v}):del.push(i.dataset.k);});
    const r1=await sb.from('markups').upsert(up);const r2=del.length?await sb.from('markups').delete().in('key',del.filter(k=>k!=='*')):{};
    $('#mkMsg').textContent=r1.error||r2.error?'Ошибка: '+(r1.error||r2.error).message:'Сохранено';};
  $('#catFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const m=$('#catMsg');
    let rows;try{rows=JSON.parse(await f.text());}catch{m.textContent='Это не файл каталога';return;}
    if(!Array.isArray(rows)||!rows[0]?.id){m.textContent='Это не файл каталога';return;}
    const now=new Date().toISOString();rows=rows.map((x,i)=>({id:x.id,kind:x.kind,sec:x.sec,grp:x.grp||'',name:x.name,unit:x.unit,price:x.price,params:x.params||{},photo:x.photo,src:x.src,sort:i,active:true,updated_at:now}));
    for(let i=0;i<rows.length;i+=500){m.textContent=`Загружаем… ${i} из ${rows.length}`;const {error}=await sb.from('cat_items').upsert(rows.slice(i,i+500));if(error){m.textContent='Ошибка: '+error.message;return;}}
    const {error}=await sb.from('cat_items').update({active:false}).lt('updated_at',now);
    m.textContent=error?'Загружено, но старые позиции не отключились: '+error.message:`Готово: ${rows.length} позиций. Позиции, которых нет в файле, скрыты.`;};
}
