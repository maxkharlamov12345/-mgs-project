/* ===== шапка как на главной (home.html): логотип закреплён по центру сверху, кружок меню справа; классы site- ===== */
:root{--site-hd:72px;--site-side:32px}
.site-hd{position:absolute;left:0;right:0;top:0;z-index:46;height:calc(var(--site-hd) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;pointer-events:none}
.site-hd::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(100% + 28px);z-index:-1;pointer-events:none;opacity:0;transition:opacity .25s;
  background:linear-gradient(to bottom,rgba(15,14,12,.92) 0%,rgba(15,14,12,.78) 55%,rgba(15,14,12,0) 100%)}
/* общей полосы-затемнения под шапкой нет (Макс 22.10) — только тень у логотипа и тёмный кружок меню, как на главной */
.site-logo{pointer-events:auto;display:inline-flex;line-height:0;filter:drop-shadow(0 2px 10px rgba(0,0,0,.55))}
.site-logo img{height:38px;width:auto;display:block}
.site-menu-btn{position:fixed;z-index:46;right:var(--site-side);top:calc(env(safe-area-inset-top) + (var(--site-hd) - 46px)/2);width:46px;height:46px;border-radius:50%;padding:0;cursor:pointer;
  background:rgba(30,27,24,.72);border:1px solid rgba(244,241,236,.12);pointer-events:auto;transition:background-color .2s}
.site-menu-btn span{position:absolute;left:14px;right:14px;height:1.6px;border-radius:2px;background:#f4f1ec;transition:transform .3s,opacity .2s,top .3s}
.site-menu-btn span:nth-child(1){top:16px}.site-menu-btn span:nth-child(2){top:22px}.site-menu-btn span:nth-child(3){top:28px}
.site-menu-btn.open{background:#bfd630} .site-menu-btn.open span{background:#1c1a17}
.site-menu-btn.open span:nth-child(1){top:22px;transform:rotate(45deg)} .site-menu-btn.open span:nth-child(2){opacity:0} .site-menu-btn.open span:nth-child(3){top:22px;transform:rotate(-45deg)}
.site-menu{position:fixed;inset:0;z-index:45;background:#0f0e0c;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;font-family:Onest,system-ui,sans-serif;
  padding:calc(var(--site-hd) + 20px) 24px 30px;opacity:0;pointer-events:none;transition:opacity .2s}
.site-menu.open{opacity:1;pointer-events:auto}
/* закрытое меню убираем совсем (display:none): iPhone Safari видит закреплённый на весь экран тёмный слой даже прозрачным и заливает полосу под часами — лента после меню «уменьшалась» */
.site-menu[hidden]{display:none !important}
.site-menu > a{font-size:30px;font-weight:300;letter-spacing:-.01em;padding:8px 0;color:#f4f1ec;text-decoration:none}
.site-menu > a:hover,.site-menu > a.active{color:#bfd630}
.site-menu .mm-contacts{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.site-menu .mm-contacts > a{font-size:22px;font-weight:500;color:#bfd630;text-decoration:none}
.site-menu .mm-contacts span{display:flex;gap:18px} .site-menu .mm-contacts span a{font-size:16px;color:#a89f92;text-decoration:none}
@media (min-width:1000px){ .site-menu{padding-left:12vw} .site-menu > a{font-size:44px} }
@media (max-width:999px){ :root{--site-hd:64px;--site-side:16px} .site-logo img{height:32px} }
.top-sec{padding-top:calc(var(--site-hd) + 10px + env(safe-area-inset-top)) !important}
/* меню открыто: прокрутку НЕ запрещаем (iPhone от overflow:hidden перестраивал экран — лента «съезжала» после закрытия меню);
   вместо этого прячем саму ленту, а меню тянем на всю высоту с запасом под «парящие» панели Safari — ничего не просвечивает */
/* лента под меню — прозрачная (opacity), а не visibility:hidden: iPhone при visibility перерисовывал всю ленту заново и она появлялась с лагом;
   при opacity картинки остаются готовыми, после закрытия лента мягко проявляется сразу */
/* открытие: меню проявляется поверх ленты, лента гаснет мгновенно уже ПОСЛЕ этого (без «двойной картинки»);
   закрытие: меню исчезает сразу и лента сразу на месте — раньше они полсекунды проступали друг сквозь друга, выглядело как лаг */
html.site-menu-open #dc-root{opacity:0;transition:opacity 0s .2s}
/* пункты меню на той же высоте, что на главной: там снизу запас под док (96px ПК / 84px телефон) + 30px */
.site-menu{padding-bottom:126px !important}
@media (max-width:999px){ .site-menu{padding-bottom:114px !important} }
/* меню — ровно по экрану (inset:0), пункты по центру; тёмный фон продлён вниз под «парящие» панели Safari */
.site-menu::after{content:"";position:absolute;left:0;right:0;top:100%;height:50vh;background:#0f0e0c;pointer-events:none}

/* «просмотр как лента» : на телефоне просмотр — сама страница, не окно поверх */
@media (max-width: 999px){
  html.lb-on{scroll-snap-type:y mandatory;scroll-padding-top:5px}

  html.lb-on body > :not(#dc-root):not(script):not(style):not([data-dbg]){display:none !important}
  html.lb-on #lb-wrap{position:relative !important;inset:auto !important;overflow:visible !important;min-height:100lvh;scroll-snap-type:none !important}

  /* описание после последнего фото — без примагничивания (lb-free ставит vScroll); последнее фото без описания —
     точка у самого низа страницы (достижима при любой высоте экрана — не дёргается, когда браузер прячет панели) */
  html.lb-on .lb-panel{scroll-snap-align:none !important;flex-grow:1}
  html.lb-on #lb-wrap::after{content:"";display:block;flex:none;height:1px;scroll-snap-align:end}
  html.lb-free,html.lb-hold{scroll-snap-type:none !important}
  html.lb-free .lb-vcount{opacity:0;transition:opacity .2s}  /* на описании счётчик фото не налезает на заголовок */
}
</style>

/* Заголовок «маркер + стикер» (Макс 23.10, вариант 6): тонкий текст, под ним прорисовывается лаймовый маркер, сверху прыгает стикер */
.mk-w{position:relative;display:inline}

  transform:rotate(12deg) scale(0);box-shadow:0 8px 24px rgba(0,0,0,.4);animation:mk-pop .55s cubic-bezier(.3,1.7,.5,1) 1.05s forwards,mk-wob 3s ease-in-out 1.7s infinite}
@keyframes mk-pop{to{transform:rotate(12deg) scale(1)}}
@keyframes mk-wob{0%,100%{transform:rotate(12deg) scale(1)}50%{transform:rotate(4deg) scale(1.06)}}
@media (prefers-reduced-motion:reduce){ .mk-t{animation:none;background-size:100% .42em} .mk-st{animation:none;transform:rotate(12deg)} }

  .top-sec{display:none !important}
  .chips-nav + div.pad, .chips-nav ~ .pad{padding-top:5px !important}
  /* плашки — внизу экрана, без серой подложки */
  .chips-nav{position:fixed !important;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) - 8px);z-index:44;padding:20px var(--site-side) 20px !important;scroll-padding:0 var(--site-side);background:none !important;
    mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
  .chips-nav::after{content:"";flex:none;width:1px}
  /* без цифр-количества на плашках */
  .chips-nav .chip > span[style]{display:none}
  .chips-nav .chip{font-size:0 !important} .chips-nav .chip > .sc-interp{font-size:15px}
  /* у каждой плашки своя тень; отступы у ленты плашек — чтобы тень не обрезалась прокруткой/маской в общую полосу */
  .chips-nav .chip{box-shadow:0 4px 14px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4)}
  .feed-col:last-child{padding-bottom:0}
  .feed-sec:last-child .feed-col{padding-bottom:70px}
}
.feed-sec + .feed-sec{margin-top:16px}
@media (max-width:999px){ .feed-sec + .feed-sec{margin-top:5px} }

/* ТЕСТ (Макс 23.10): лента без затемнений и текста поверх фото, без значка «развернуть»;
   «Комплекс» — без белого названия и затемнения, ЖК — светлой плашкой в левом нижнем углу всегда */
.ph-over,.ph-exp,.cx-title,.cx-more{display:none !important}
.pin-btn:hover .pin-img{transform:none !important}  /* без приближения фото при наведении/касании */
.cx-big,.pin-btn:hover .cx-big,.pin-btn:focus-visible .cx-big{background:none !important;justify-content:flex-end !important;align-items:flex-start !important;padding:12px !important}
.cx-big::before{display:none !important}
.cx-more{height:32px;box-sizing:border-box;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.94);color:#1c1a17 !important;font-size:13px !important;font-weight:500;text-shadow:none}
.cx-more svg{display:none}
@media (max-width:999px){ .cx-big{padding:8px !important} .cx-more{height:28px;padding:0 10px;font-size:12px !important} }

/* ===== ТЕСТ (Макс 23.10): «рилс-лента» на телефоне — REELS и «Комплекс» по одной карточке в ряд, листается сама страница
   (Safari прячет панели, видео под часами), свайп доводит ровно до следующей (примагничивание на html), играет только верхняя ===== */
.rl-num,.rl-prog,.rl-play,.rl-snd{display:none}
html.cx-snap{scroll-snap-type:y mandatory;scroll-padding-top:5px}
html.cx-snap .chips-nav ~ .pad{padding-top:5px !important}
.feed.rl .feed-col{gap:5px !important}
.feed.rl .pin{flex:none !important;scroll-snap-align:start;scroll-snap-stop:always}
.feed.rl-cx .feed-col{padding-bottom:calc(100lvh - (100vw - 10px) * 1.25 - 10px) !important}
/* рилс — 9:16 во всю ширину, но не выше экрана (как в просмотре рилсов) */
.feed.rl-reels .pin{padding-top:0 !important;height:min(177.78vw, calc(100svh - 10px));border-radius:10px !important}
.feed.rl-reels .feed-col{padding-bottom:calc(100lvh - min(177.78vw, calc(100svh - 10px)) - 10px) !important}
.feed.rl-reels .pin > span:not([class]){display:none !important}  /* плашки REELS/зона — в рилс-ленте не нужны */
.feed.rl-reels .pin button[aria-label^="Открыть REELS"] > span{display:none !important}  /* значок «развернуть» */
.feed.rl .rl-num{display:inline-flex;position:absolute;left:10px;top:63px;z-index:3;height:32px;box-sizing:border-box;align-items:center;padding:0 12px;border-radius:999px;background:rgba(15,14,12,.7);color:#f4f1ec;font-size:13px;pointer-events:none}
.feed.rl-reels .rl-prog{display:block;position:absolute;left:12px;right:12px;bottom:74px;z-index:3;height:3px;border-radius:2px;background:rgba(244,241,236,.3);overflow:hidden;pointer-events:none}
.feed.rl-reels .rl-prog i{display:block;height:100%;width:0;background:#f4f1ec}
.feed.rl-reels .rl-snd{display:flex;position:absolute;right:12px;bottom:88px;z-index:4;width:40px;height:40px;border:0;border-radius:50%;background:rgba(15,14,12,.6);color:#f4f1ec;align-items:center;justify-content:center;cursor:pointer}
.rl-snd .s-on{display:none} html.rl-sound .rl-snd .s-on{display:block} html.rl-sound .rl-snd .s-off{display:none}
.feed.rl-reels .pin.rl-paused .rl-play{display:flex;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;width:64px;height:64px;border-radius:50%;background:rgba(15,14,12,.6);color:#f4f1ec;align-items:center;justify-content:center;pointer-events:none}
/* счётчик — под шапкой (телефон/логотип/меню), звук и полоска — над плашками снизу */
/* кружок загрузки на видео, пока у него нет кадра */
@keyframes vspin{to{transform:rotate(360deg)}}
.v-wait::after{content:"";position:absolute;left:50%;top:50%;z-index:4;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;box-sizing:border-box;
  border:3px solid rgba(244,241,236,.25);border-top-color:#bfd630;animation:vspin .8s linear infinite;pointer-events:none}
</style>
</helmet>

<div style="font-family: Onest, system-ui, sans-serif; color: #f4f1ec; background: #0f0e0c; min-height: 100vh">

  <!-- заголовок -->
  <section class="pad top-sec" style="padding: 44px 32px 8px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
    <h1 class="ttl" style="margin: 0; font-weight: 300; font-size: 54px; line-height: 1.05; letter-spacing: -0.02em"><span class="mk-w"><span class="mk-t">Наши работы</span><span class="mk-st" aria-hidden="true">#MGS</span></span></h1>
  </section>

  <!-- ленты: у всех одинаковая сетка, а открытие разное (REELS — рилсы, Комплекс — страница проекта, остальные — просмотр изделия) -->
  <nav aria-label="Ленты: наши работы" class="pad chips-nav" style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 18px 32px 26px">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
      <button class="chip" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}">{{c.label}} <span style="opacity: 0.6; font-weight: 400">{{c.count}}</span></button>
    </sc-for>
  </nav>

  <!-- лента -->
  <div class="pad" style="padding: 0 12px 64px">
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="text-align: center; color: #a89f92; font-size: 15px; padding: 40px 0">Скоро здесь появятся проекты</div>
    </sc-if>
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="1">
    <div class="feed-sec" data-sec="{{sec.name}}">
    <div class="{{feedCls}}" style="display: flex; gap: 16px; align-items: stretch; max-width: 1920px; margin: 0 auto">
      <sc-for list="{{sec.columns}}" as="col" hint-placeholder-count="4">
      <div class="feed-col" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <sc-for list="{{col.pins}}" as="p" hint-placeholder-count="3">

        <!-- изделие: открывает просмотр с остальными фото этого изделия -->
        <sc-if value="{{p.isPhoto}}" hint-placeholder-val="{{ true }}">
          <div class="pin" data-key="{{p.key}}" style="position: relative; flex: {{p.flex}}">
            <div aria-hidden="true" style="padding-top: {{p.padTop}}"></div>
            <button class="pin-btn" onClick="{{p.open}}" aria-label="Открыть: {{p.label}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: block; width: 100%; height: 100%; padding: 0; border: 0; border-radius: 18px; overflow: hidden; background: #1f1c19; cursor: zoom-in">
              <img class="pin-img" src="{{p.src}}" alt="{{p.label}}" decoding="async" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: {{p.pos}}">
              <!-- при наведении: затемнение, название по центру, значок «развернуть» в правом верхнем углу -->
              <span class="ph-over" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center; color: #f4f1ec; pointer-events: none">
                <span class="ph-title" style="font-size: 24px; font-weight: 300; line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance; text-shadow: 0 2px 16px rgba(0,0,0,0.45)">{{p.label}}</span>
                <span class="ph-sub" style="font-size: 13px; font-weight: 500; color: #bfd630">{{p.sub}}</span>
              </span>
              <span class="ph-exp" style="position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.94); color: #1c1a17; display: flex; align-items: center; justify-content: center; pointer-events: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></span>
            </button>
          </div>
        </sc-if>

        <!-- комплексный проект: ведёт на страницу проекта -->
        <sc-if value="{{p.isLink}}" hint-placeholder-val="{{ false }}">
          <div class="pin cx-pin" data-key="{{p.key}}" style="position: relative; flex: {{p.flex}}">
            <div aria-hidden="true" style="padding-top: {{p.padTop}}"></div>
            <span class="rl-num">{{p.num}}</span>
            <a class="pin-btn" href="{{p.href}}" aria-label="Открыть проект: {{p.label}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: block; border-radius: 18px; overflow: hidden; background: #1f1c19; text-decoration: none">
              <!-- обложка-видео проекта (поле coverVideo): играет, когда плитка видна на экране -->
              <sc-if value="{{p.hasVideo}}" hint-placeholder-val="{{ false }}">
                <img class="vid-ph" src="{{p.ph}}" alt="" aria-hidden="true" decoding="async" style="position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; object-fit: cover">
                <video class="pin-img feed-v" data-src="{{p.video}}" preload="none" muted="" loop="" playsinline="" style="pointer-events: none; position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; object-fit: cover"></video>
              </sc-if>
              <sc-if value="{{p.noVideo}}" hint-placeholder-val="{{ true }}">
                <span class="cx-blank" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #26221f"></span>
              </sc-if>
              <!-- «Крупный заголовок»: фото притемнены, по центру — крупное тонкое название и адрес (ЖК) со стрелкой -->
              <span class="cx-big" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 16px; color: #f4f1ec; pointer-events: none">
                <span class="cx-title" style="font-size: 30px; font-weight: 300; line-height: 1.08; letter-spacing: -0.01em; text-shadow: 0 2px 18px rgba(0,0,0,0.5); text-wrap: balance">{{p.label}}</span>
                <span class="cx-more" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #bfd630">{{p.address}} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
              </span>
            </a>
          </div>
        </sc-if>

        <!-- рилс: открывает режим REELS, как на странице проекта -->
        <sc-if value="{{p.isVideo}}" hint-placeholder-val="{{ false }}">
          <div class="pin" data-key="{{p.key}}" style="position: relative; flex: none; border-radius: 18px; overflow: hidden; background: #1f1c19; padding-top: 177.78%">
            <img class="vid-ph" src="{{p.ph}}" alt="" aria-hidden="true" decoding="async" style="position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; object-fit: cover">
            <video class="feed-v" data-src="{{p.src}}" preload="none" muted="" loop="" playsinline="" style="pointer-events: none; position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; object-fit: cover"></video>
            <span style="position: absolute; left: 12px; top: 12px; right: 56px; display: flex; flex-wrap: wrap; gap: 6px">
              <span style="height: 32px; box-sizing: border-box; display: inline-flex; align-items: center; background: rgba(255,255,255,0.94); color: #1c1a17; font-size: 13px; font-weight: 500; padding: 0 12px; border-radius: 999px; letter-spacing: 0.04em">REELS</span>
              <sc-if value="{{p.hasZone}}" hint-placeholder-val="{{ false }}"><span style="height: 32px; box-sizing: border-box; display: inline-flex; align-items: center; background: rgba(255,255,255,0.94); color: #1c1a17; font-size: 13px; font-weight: 500; padding: 0 12px; border-radius: 999px">{{p.zone}}</span></sc-if>
            </span>
            <span class="rl-num">{{p.num}}</span>
            <span class="rl-prog" aria-hidden="true"><i></i></span>
            <span class="rl-play" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg></span>
            <button onClick="{{p.open}}" aria-label="Открыть REELS: {{p.label}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: pointer">
              <span style="position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.94); color: #1c1a17; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></span>
            </button>
            <button class="rl-snd" onClick="{{p.snd}}" aria-label="Звук"><svg class="s-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M22 9l-6 6M16 9l6 6"></path></svg><svg class="s-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg></button>
          </div>
        </sc-if>

      </sc-for>
      </div>
      </sc-for>
    </div>
    </div>
    </sc-for>
  </div>



  <!-- полноэкранный просмотр: как на странице проекта -->
  <!-- полноэкранный просмотр -->
  <sc-if value="{{lbOpen}}" hint-placeholder-val="{{ false }}">
    <div id="lb-wrap" class="lb-wrap" onScroll="{{vScroll}}" role="dialog" aria-modal="true" aria-label="Просмотр: {{lb.zone}}" style="position: fixed; inset: 0; z-index: 50; background: #0b0a09; color: #f4f1ec; display: flex">

      <!-- фото -->
      <div class="lb-stage" style="position: relative; flex: 1; min-width: 0; display: flex; align-items: stretch; padding: 0; --lbh: {{lbH}}">
        <sc-if value="{{isReels}}" hint-placeholder-val="{{ false }}">
          <button class="lb-desktop" onClick="{{closeLb}}" aria-label="Закрыть" style="position: absolute; z-index: 5; top: 24px; right: 24px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(40,36,32,0.85); color: #f4f1ec; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </sc-if>
        <button class="lb-close-m" onClick="{{closeLb}}" aria-label="Закрыть" style="display: none; position: absolute; top: 20px; right: 20px; z-index: 2; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(15,14,12,0.7); color: #f4f1ec; cursor: pointer; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        <div id="lb-track" class="lb-track {{trackCls}}" onScroll="{{lbScroll}}" onWheel="{{lbWheel}}">
          <sc-for list="{{lbLoop}}" as="t" hint-placeholder-count="3">
            <div class="lb-slide">
              <sc-if value="{{t.isImg}}" hint-placeholder-val="{{ true }}">
                <img class="lb-slide-img" src="{{t.src}}" alt="Фото {{t.n}}" decoding="sync" onLoad="{{t.measure}}" style="aspect-ratio: {{t.ar}}">
              </sc-if>
              <sc-if value="{{t.isVideo}}" hint-placeholder-val="{{ false }}">
                <div style="position: relative; height: 100%">
                  <video class="lb-slide-img" src="{{t.vsrc}}" data-src="{{t.key}}" poster="{{t.poster}}" muted="" loop="" playsinline="" preload="metadata" data-lb="1" onClick="{{vClick}}" onPlay="{{vEv}}" onPause="{{vEv}}" onVolumeChange="{{vEv}}" onTimeUpdate="{{vTime}}" data-k="{{t.key}}" style="aspect-ratio: {{t.ar}}; background: #000 url('{{t.pt}}') center / cover no-repeat; cursor: pointer"></video>
                  <button class="v-snd" onClick="{{vSnd}}" aria-label="Звук" style="position: absolute; top: 12px; right: 12px; z-index: 3; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(15,14,12,0.6); color: #f4f1ec; cursor: pointer; display: flex; align-items: center; justify-content: center"><sc-if value="{{t.sndOn}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg></sc-if><sc-if value="{{t.sndOff}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M22 9l-6 6M16 9l6 6"></path></svg></sc-if></button><sc-if value="{{t.paused}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; background: rgba(15,14,12,0.6); color: #f4f1ec; display: flex; align-items: center; justify-content: center; pointer-events: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span></sc-if>
                  <div class="v-bar" onPointerDown="{{vSeekDown}}" onPointerMove="{{vSeekMove}}" onPointerUp="{{vSeekUp}}" onPointerCancel="{{vSeekUp}}" style="position: absolute; left: 12px; right: 12px; bottom: 6px; height: 26px; z-index: 3; cursor: pointer; touch-action: none; display: flex; align-items: center"><div style="position: relative; width: 100%; height: 4px; border-radius: 2px; background: rgba(244,241,236,0.3); overflow: hidden"><div class="v-fill" style="position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: {{accent}}"></div></div></div>
                </div>
              </sc-if>
            </div>
          </sc-for>
          <div class="lb-spacer" aria-hidden="true"></div>
        </div>
        <div class="lb-fade lb-fade-r" aria-hidden="true" style="position: absolute; z-index: 3; top: 0; bottom: 0; right: 0; width: 320px; pointer-events: none; background: linear-gradient(to right, rgba(21,19,17,0) 0%, rgba(21,19,17,0.03) 15%, rgba(21,19,17,0.09) 30%, rgba(21,19,17,0.2) 45%, rgba(21,19,17,0.36) 60%, rgba(21,19,17,0.56) 75%, rgba(21,19,17,0.78) 88%, rgba(21,19,17,1) 100%)"></div>
        <div class="lb-fade" aria-hidden="true" style="position: absolute; z-index: 3; top: 0; bottom: 0; left: 0; width: 260px; pointer-events: none; background: linear-gradient(to left, rgba(11,10,9,0) 0%, rgba(11,10,9,0.03) 15%, rgba(11,10,9,0.09) 30%, rgba(11,10,9,0.2) 45%, rgba(11,10,9,0.36) 60%, rgba(11,10,9,0.56) 75%, rgba(11,10,9,0.78) 88%, rgba(11,10,9,1) 100%)"></div>
        <sc-if value="{{lbMulti}}" hint-placeholder-val="{{ true }}">

  // сводим проекты в плоские списки для лент
  data() {
    if (this._data) return this._data;
    var reels = [], items = [], byKey = {}, photos = [], videos = [];
    var prs = this.projects();
    prs.forEach(function (pr, pi) {
      if (pr.cover) photos.push(pr.cover);
      // у рилса два тега: REELS и изделие, к которому видео тоже относится (если есть)
      (pr.reels || []).forEach(function (r) {
        var zone = '';
        (pr.items || []).forEach(function (it) { (it.videos || []).forEach(function (v) { if (v.src === r.src) zone = it.name; }); });
        reels.push({ src: r.src, poster: r.poster, project: pr.title, href: pr.href, zone: zone }); videos.push(r.src);
      });
      (pr.items || []).forEach(function (it, ii) {
        var key = pi + '-' + ii;
        var x = { key: key, name: it.name, type: it.type, photos: it.photos || [], videos: it.videos || [], text: it.text || '', price: it.price || '',
          korpus: it.korpus || '—', fasady: it.fasady || '—', furn: it.furn || '—', project: pr.title, href: pr.href, address: pr.address || '', priceDate: pr.priceDate || '' };
        items.push(x); byKey[key] = x;
        x.photos.forEach(function (s) { photos.push(s); });
        x.videos.forEach(function (v) { videos.push(v.src); });
      });
    });
    var uniq = function (a) { return a.filter(function (s, i) { return s && a.indexOf(s) === i; }); };
    this._data = { projects: prs, reels: reels, items: items, byKey: byKey, photos: uniq(photos), videos: uniq(videos) };
    return this._data;
  }
