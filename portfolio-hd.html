<style>
:root{--bg:#0f0e0c;--tx:#f4f1ec;--chip:#26221f;--lime:#bfd630;--dim:#a89f92;--side:16px;--hd:58px;--top:calc(var(--hd) + env(safe-area-inset-top) + 14px)}  /* --top — отступ контента от верха; от этой же высоты листаются рилсы и «Комплекс» */
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
img,video{display:block}
/* листание по одной карточке — своё (JS, см. «листание»), НЕ css scroll-snap: на iPhone он дёргал страницу и путал ленты */

/* ---------- шапка: отдельные небольшие элементы (полоса во всю ширину заставляет Safari заливать зону часов) ---------- */
.hd-btn{position:fixed;z-index:46;top:calc(env(safe-area-inset-top) + (var(--hd) - 40px)/2);width:40px;height:40px;border-radius:50%;
  background:rgba(30,27,24,.72);border:1px solid rgba(244,241,236,.12);display:flex;align-items:center;justify-content:center;color:var(--tx);text-decoration:none}
.hd-call{left:var(--side)}
.hd-menu{right:var(--side)}
.hd-menu span{position:absolute;left:12px;right:12px;height:1.6px;border-radius:2px;background:var(--tx);transition:transform .3s,opacity .2s,top .3s}
.hd-menu span:nth-child(1){top:13px}.hd-menu span:nth-child(2){top:19px}.hd-menu span:nth-child(3){top:25px}
.hd-menu.open{background:var(--lime)} .hd-menu.open span{background:#1c1a17}
.hd-menu.open span:nth-child(1){top:19px;transform:rotate(45deg)} .hd-menu.open span:nth-child(2){opacity:0} .hd-menu.open span:nth-child(3){top:19px;transform:rotate(-45deg)}
.hd-logo{position:fixed;z-index:46;left:0;right:0;width:max-content;margin:0 auto;top:calc(env(safe-area-inset-top) + (var(--hd) - 34px)/2);line-height:0;filter:drop-shadow(0 2px 10px rgba(0,0,0,.55))}
.hd-logo img{height:34px;width:auto}
.menu{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;padding:calc(var(--hd) + 20px) 24px 114px;opacity:0;transition:opacity .2s}
.menu.open{opacity:1}
.menu[hidden]{display:none}
.menu > a{font-size:30px;font-weight:300;letter-spacing:-.01em;padding:8px 0;text-decoration:none}
.menu > a.active{color:var(--lime)}
.menu .mm{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.menu .mm > a{font-size:22px;font-weight:500;color:var(--lime);text-decoration:none}
.menu .mm span{display:flex;gap:18px} .menu .mm span a{font-size:16px;color:var(--dim);text-decoration:none}
html.menu-open #feed,html.menu-open .chips{opacity:0;transition:opacity 0s .2s}
@media (min-width:1000px){ .menu{padding-left:12vw;padding-bottom:126px} .menu > a{font-size:44px} }

/* ---------- плашки-ленты внизу ---------- */
.chips{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) - 8px);z-index:44;overflow-x:auto;scrollbar-width:none;padding:20px var(--side);
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chips-in{display:flex;gap:8px;width:max-content;margin:0 auto;padding-right:2px}
.chip{flex:none;height:44px;padding:0 18px;border-radius:999px;background:var(--chip);color:var(--tx);font-size:15px;font-weight:500;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4)}
.chip.on{background:var(--lime);color:#1c1a17}
/* подфильтры ленты (Кухни: форма) — всплывают строкой над плашками */
.subchips{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) - 8px + 66px);z-index:45;overflow-x:auto;scrollbar-width:none;padding:14px var(--side) 6px;
  opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .22s,transform .3s cubic-bezier(.2,.7,.2,1)}
.subchips::-webkit-scrollbar{display:none}
.subchips.show{opacity:1;transform:none;pointer-events:auto}
.subchips .chips-in{gap:6px}
.sub{flex:none;height:34px;padding:0 14px;border-radius:999px;background:rgba(38,34,31,.92);color:var(--tx);font-size:14px;font-weight:400;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.sub.on{background:var(--tx);color:#1c1a17;font-weight:500}
html.menu-open .subchips,html.viewing .subchips{display:none}
.grid.has-sub{padding-bottom:140px}

/* ---------- лента ---------- */
/* в начале контент — с отступом под шапку; при прокрутке уходит под неё */
#feed{padding:var(--top) 5px 0;min-height:calc(100vh + 2px);min-height:calc(100lvh + 2px)}  /* страница всегда чуть выше экрана: короткая лента (подфильтр) не возвращает панель Safari — иначе плашки дёргались вверх */
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.in{animation:up .5s cubic-bezier(.2,.7,.2,1) backwards}

/* рилс-лента (REELS, Комплекс) */
.lenta{display:flex;flex-direction:column;align-items:center;gap:5px;padding-bottom:calc(100lvh - var(--ch, 400px) - var(--top))}
.card{position:relative;flex:none;width:calc(100vw - 10px);border-radius:10px;overflow:hidden;background:#1d1a17;cursor:pointer}
/* все карточки встают на одну высоту — под шапкой (--top) и целиком помещаются на экране */
.card.reel{height:min(177.78vw, calc(100svh - var(--top) - 5px))}
/* то, что выше и ниже текущей карточки, — притемнено градиентом: глаз смотрит на текущую */
.lenta .card::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .35s ease}
.lenta .card.above::after{opacity:1;background:linear-gradient(to bottom, rgba(15,14,12,.98), rgba(15,14,12,.82))}
.lenta .card.below::after{opacity:1;background:linear-gradient(to top, rgba(15,14,12,.98), rgba(15,14,12,.78))}
.lenta .card.above .num,.lenta .card.below .num{opacity:0}  /* у притемнённых — без счётчика */
.card.cx{aspect-ratio:4/5;border-radius:14px}
@media (min-width:760px){
  .card.reel{width:calc((100svh - var(--top) - 5px) * .5625);height:calc(100svh - var(--top) - 5px)}
  .card.cx{width:min(calc(100vw - 10px), calc((100svh - var(--top) - 5px) * .8))}
}
.card .poster,.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card video{opacity:0;transition:opacity .15s}
.card video.ready{opacity:1}
.num{position:absolute;left:10px;top:10px;z-index:3;height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;background:rgba(15,14,12,.7);font-size:13px;pointer-events:none}
.play-ico{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;width:64px;height:64px;border-radius:50%;background:rgba(15,14,12,.6);align-items:center;justify-content:center;pointer-events:none}
.card.paused .play-ico{display:flex}
.snd{position:absolute;right:12px;bottom:92px;z-index:4;width:40px;height:40px;border-radius:50%;background:rgba(15,14,12,.6);display:flex;align-items:center;justify-content:center}
.snd .on{display:none} html.sound .snd .on{display:block} html.sound .snd .off{display:none}
/* полоска прогресса: тянется пальцем (перемотка); зона касания выше самой полоски */
.prog{position:absolute;left:4px;right:4px;bottom:62px;z-index:4;height:26px;padding:11px 8px;touch-action:none;cursor:pointer}
.prog b{display:block;height:4px;border-radius:2px;background:rgba(244,241,236,.3);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--tx)}
.prog.drag b{height:6px;margin-top:-1px}
/* «Комплекс», вариант 4: плашки сверху, крупное тонкое название снизу */
.cx-chips{position:absolute;left:10px;top:10px;right:10px;z-index:3;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.cx-chips span{height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;background:rgba(244,241,236,.94);color:#1c1a17;font-size:13px;font-weight:500}
.cx-chips span.dark{background:rgba(15,14,12,.7);color:var(--tx)}
.cx-bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:90px 16px 18px;background:linear-gradient(to top,rgba(10,9,8,.85),rgba(10,9,8,0));pointer-events:none}
.cx-bottom h3{margin:0 0 8px;font-size:34px;font-weight:300;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.cx-zones{font-size:13px;color:#cfc9bf;line-height:1.4}
.lenta .card.above .cx-chips,.lenta .card.below .cx-chips{opacity:0}
@media (min-width:760px){ .cx-bottom h3{font-size:40px} .cx-zones{font-size:14px} }
/* просмотр рилсов (касание превью REELS): рилс-лента на весь экран — шапки нет, ролики 9:16 от верха */
.rvl{padding:5px 0 calc(100lvh - var(--ch, 400px) - 10px)}
.rvl .card.reel{height:min(177.78vw, calc(100svh - 10px))}
@media (min-width:760px){ .rvl .card.reel{width:calc((100svh - 10px) * .5625);height:calc(100svh - 10px)} }
.rvl .num{top:10px}
html.rv .vcount{display:none !important}
.rvl .prog{bottom:8px} .rvl .snd{bottom:40px}  /* в просмотре плашек снизу нет — полоска и звук у края ролика */
html.rv .vclose{top:calc(10px + env(safe-area-inset-top))}
.rvl .card.reel .num{left:10px}
/* кружок загрузки */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:none;position:absolute;left:50%;top:50%;z-index:3;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:3px solid rgba(244,241,236,.25);border-top-color:var(--lime);animation:spin .8s linear infinite;pointer-events:none}
.wait .spin{display:block}
.wait.paused .play-ico{display:none}

/* сетка (Кухни, Спальни, …) */
.grid{display:flex;gap:5px;align-items:flex-start;padding-bottom:90px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.tile{position:relative;display:block;width:100%;border-radius:14px;overflow:hidden;background:#1d1a17}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.empty{padding:120px 20px;text-align:center;color:var(--dim)}
@media (min-width:760px){ #feed{padding:var(--top) 12px 0} .grid,.col{gap:16px} .tile{border-radius:18px} }

/* ---------- просмотр изделия: сама страница, фото одно под другим ---------- */
#view{display:none}
html.viewing #view{display:block}
html.viewing #feed,html.viewing .chips,html.viewing .hd-btn,html.viewing .hd-logo{display:none}
.vl{display:flex;flex-direction:column;align-items:center;gap:5px;padding:calc(var(--top) + 10px) 5px 0}
.vm{position:relative;width:calc(100vw - 10px);max-width:900px;border-radius:10px;overflow:hidden;background:#1d1a17 center/cover no-repeat}
.vm img{width:100%;height:100%;object-fit:cover}
.vm.vid{height:min(177.78vw, calc(100svh - 10px));max-width:calc((100svh - 10px) * .5625)}
.vm.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vm.vid .snd{bottom:16px}
.vpanel{width:100%;max-width:900px;margin:0 auto;padding:26px 16px 60px}
.vpanel h1{margin:0 0 6px;font-size:30px;font-weight:300;letter-spacing:-.01em}
.vpanel .sub{color:var(--lime);font-size:14px;font-weight:500;margin-bottom:16px}
.vpanel p{margin:0 0 18px;color:#d9d4cc;font-size:15px;line-height:1.55}
.specs{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin-bottom:22px}
.specs dt{color:var(--dim)} .specs dd{margin:0}
.price{font-size:28px;font-weight:500;margin-bottom:4px} .pdate{color:var(--dim);font-size:13px;margin-bottom:20px}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;height:52px;border-radius:999px;font-size:16px;font-weight:600;text-decoration:none}
.btn.main{background:var(--lime);color:#1c1a17} .btn.sec{background:var(--chip)}
.vtop{position:fixed;z-index:50;top:calc(14px + env(safe-area-inset-top));height:40px;display:none}
html.viewing .vtop{display:flex}
.vcount{left:14px;align-items:center;padding:0 14px;border-radius:999px;background:rgba(15,14,12,.7);font-size:13px;height:32px;top:calc(18px + env(safe-area-inset-top))}
html.vfree .vcount{opacity:0}
.vclose{right:14px;width:40px;border-radius:50%;background:rgba(15,14,12,.7);align-items:center;justify-content:center}
</style>

  if (!list.length) return '<div class="empty">Скоро здесь появятся работы</div>';
  var w = window.innerWidth, n = w < 760 ? 2 : w < 1100 ? 3 : 4, cols = [], hs = [];
  for (var i = 0; i < n; i++) { cols.push([]); hs.push(0); }
  list.forEach(function (it, k) {
    var r = Math.max(.8, Math.min(1.45, ratio(it.photos[0]))), c = hs.indexOf(Math.min.apply(null, hs));
    cols[c].push('<a class="tile in" href="#" data-k="' + ITEMS.indexOf(it) + '" style="padding-top:' + (r * 100).toFixed(2) + '%;animation-delay:' + Math.min(k * 45, 450) + 'ms" aria-label="' + esc(it.name) + '">' +
      '<img src="' + esc(thumb(it.photos[0])) + '" alt="' + esc(it.name) + '" ' + (k > 5 ? 'loading="lazy" ' : '') + 'decoding="async"></a>');
    hs[c] += r;
  });
  S.gridN = n;
  return '<div class="grid' + (SUBS[f] ? ' has-sub' : '') + '">' + cols.map(function (c) { return '<div class="col">' + c.join('') + '</div>'; }).join('') + '</div>';
}
feedEl.addEventListener('click', function (e) { var t = e.target.closest('.tile'); if (!t) return; e.preventDefault(); openView(ITEMS[+t.getAttribute('data-k')]); });
window.addEventListener('resize', function () {
  fitPad();
  if (!S.viewing && S.feed && S.feed !== 'REELS' && S.feed !== 'Комплекс') { var w = window.innerWidth, n = w < 760 ? 2 : w < 1100 ? 3 : 4; if (n !== S.gridN) feedEl.innerHTML = gridHTML(S.feed); }
});

/* ---------- просмотр изделия («как лента»): фото одно под другим, ниже — описание и цена ---------- */
function openView(it) {
  if (!it) return;
  S.viewing = true; S.feedY = window.scrollY; stopPlaying();
  var media = it.photos.map(function (p) {
    var r = ratio(p);
    return '<div class="vm" style="aspect-ratio:1/' + r + ';background-image:url(\'' + esc(thumb(p)) + '\')"><img src="' + esc(p) + '" alt="' + esc(it.name) + '" decoding="async"></div>';
  }).concat(it.videos.map(function (vv) {
    return '<div class="vm vid" style="background-image:url(\'' + esc(reelPoster(vv.src)) + '\')"><video muted playsinline loop preload="metadata" data-src="' + esc(vv.src) + '"></video>' +
      '<span class="play-ico">' + PLAY + '</span><span class="spin"></span><button class="snd" aria-label="Звук">' + SND_OFF + SND_ON + '</button></div>';
  }));
  var sub = [it.project !== it.name ? it.project : '', it.address].filter(Boolean).join(' · ');
  viewEl.innerHTML = '<div class="vl">' + media.join('') + '</div><div class="vpanel"><h1>' + esc(it.name) + '</h1>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
    (it.text ? '<p>' + esc(it.text) + '</p>' : '') +
    '<dl class="specs"><dt>Корпус</dt><dd>' + esc(it.korpus) + '</dd><dt>Фасады</dt><dd>' + esc(it.fasady) + '</dd><dt>Фурнитура</dt><dd>' + esc(it.furn) + '</dd></dl>' +
    (it.price ? '<div class="price">' + esc(it.price) + '</div><div class="pdate">Цена на ' + esc(it.priceDate || 'октябрь 2026') + '</div>' : '') +
    '<div class="btns"><a class="btn main" href="home.html#calc">Хочу такую же</a>' + (it.href ? '<a class="btn sec" href="' + esc(it.href) + '">Открыть весь проект</a>' : '') + '</div></div>';
  S.vms = $$('.vm', viewEl);
  $$('.vm.vid', viewEl).forEach(function (box) {
    var v = $('video', box); v.muted = true;
    v.addEventListener('playing', function () { box.classList.remove('wait'); });
    v.addEventListener('waiting', function () { box.classList.add('wait'); });
    box.addEventListener('click', function (e) {
      if (e.target.closest('.snd')) { v.muted = !v.muted; de.classList.toggle('sound', !v.muted); if (v.paused) v.play().catch(function () {}); return; }
      if (v.paused) { box.classList.remove('paused'); v.play().catch(function () {}); } else { v.pause(); box.classList.add('paused'); }
    });
  });
  try { history.pushState({ mgsView: 1 }, ''); S.pushed = true; } catch (e) { S.pushed = false; }
  killMomentum(); cancelAnimationFrame(P.anim); P.animating = false; P.cur = 0;
  de.classList.add('viewing'); de.classList.remove('vfree');
  jump(0);
  vScroll();
}
function vScroll() {
  var vms = S.vms || []; if (!vms.length) return;
  var last = vms[vms.length - 1], y = window.scrollY, i = 0, bd = 1e9;
  de.classList.toggle('vfree', y > last.offsetTop + 40);   // на описании прячем счётчик
  vms.forEach(function (m, k) { var d = Math.abs(m.getBoundingClientRect().top - 5); if (d < bd) { bd = d; i = k; } });
  $('#vcount').textContent = (i + 1) + ' / ' + vms.length;
  // видео в просмотре: играет только то, что на экране
  vms.forEach(function (m, k) { var v = $('video', m); if (!v) return;
    if (k === i && !m.classList.contains('paused')) { if (!v.getAttribute('src')) { v.src = v.getAttribute('data-src'); m.classList.add('wait'); } v.play().catch(function () {}); }
    else if (!v.paused) v.pause(); });
}
function closeView(fromPop) {
  if (!S.viewing) return;
  S.viewing = false; stopPlaying();
  $$('video', viewEl).forEach(function (v) { v.removeAttribute('src'); try { v.load(); } catch (e) {} });
  viewEl.innerHTML = ''; S.vms = [];
  killMomentum(); cancelAnimationFrame(P.anim); P.animating = false;
  var wasRv = S.rv;
  if (wasRv) { S.rv = false; S.cards = S.feedCards || []; S.active = null; }
  de.classList.remove('viewing', 'vfree', 'rv');
  jump(S.feedY); var fy = S.feedY; P.cur = Math.max(0, S.cards.indexOf(S.active)); requestAnimationFrame(function () { if (Math.abs(window.scrollY - fy) > 2) jump(fy); });
  if (!fromPop && S.pushed) { S.pushed = false; history.back(); }
  S.pushed = false;
  if (wasRv) requestAnimationFrame(function () { requestAnimationFrame(pickActive); });
}
$('#vclose').addEventListener('click', function () { closeView(false); });
window.addEventListener('popstate', function () { if (S.viewing) { S.pushed = false; closeView(true); } });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeView(false); });
window.addEventListener('hashchange', function () { var h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {} if (h && FEEDS.indexOf(h) >= 0 && h !== S.feed) setFeed(h); });

/* ---------- меню ---------- */
(function () {
  var m = $('#menu'), b = $('#menuBtn');
  var set = function (o) { if (o) { m.hidden = false; void m.offsetWidth; } else m.hidden = true; m.classList.toggle('open', o); b.classList.toggle('open', o); de.classList.toggle('menu-open', o); };
  b.addEventListener('click', function () { set(!m.classList.contains('open')); });
  $$('a', m).forEach(function (a) { a.addEventListener('click', function (e) { if (a.classList.contains('active')) e.preventDefault(); set(false); }); });
})();

/* ---------- старт ---------- */
try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; if (history.state && history.state.mgsView) history.replaceState(null, ''); } catch (e) {}
var h0 = ''; try { h0 = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
var startFeed = function () { setFeed(FEEDS.indexOf(h0) >= 0 ? h0 : 'REELS', true); };
if (window.MGS_RATIOS) startFeed(); else { var t0 = Date.now(), w = function () { if (window.MGS_RATIOS || Date.now() - t0 > 1500) startFeed(); else setTimeout(w, 30); }; w(); }
window.MGS_TEST = S;  // для автопроверок
})();
</script>
