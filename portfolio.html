<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфолио — MGS Mebel</title>
<meta name="description" content="Портфолио MGS Mebel: кухни, шкафы и гардеробные на заказ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0e0c; --text:#f4f1ec; --panel:#151311; --tile:#1f1c19; --muted:#a89f92;
  --chip:#26221f; --chip-hover:#322d29; --accent:#bfd630; --ink:#1c1a17;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Onest,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--text)}

/* заголовок */
.top{padding:44px 32px 8px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ttl{margin:0;font-weight:300;font-size:54px;line-height:1.05;letter-spacing:-0.02em}
.sub{font-size:14px;color:var(--muted)}

/* чипы-фильтры */
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:18px 32px 26px}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:0;font:inherit;font-size:15px;font-weight:500;cursor:pointer;
  background:var(--chip);color:var(--text);transition:background-color .2s ease,color .2s ease}
.chip:hover{background:var(--chip-hover)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.chip .n{opacity:.6;font-weight:400;margin-left:4px}
.chip:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* лента */
.pad{padding:0 12px 64px}
.feed{display:flex;gap:16px;align-items:stretch;margin:0 auto}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
.cell{position:relative;flex:1 0 auto}
.card{position:absolute;inset:0;display:block;border-radius:18px;overflow:hidden;background:var(--tile);text-decoration:none}
.card img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease,filter .3s ease}
.card:hover img{transform:scale(1.035);filter:brightness(.82)}
.card video{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.reels{position:absolute;left:12px;top:12px;height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;
  background:rgba(255,255,255,.94);color:var(--ink);font-size:13px;font-weight:500;letter-spacing:.04em}
.meta{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none;opacity:0;transition:opacity .25s ease}
.card:hover .meta,.card:focus-visible .meta{opacity:1}
.tag{height:32px;min-width:0;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;
  background:rgba(255,255,255,.95);color:var(--ink);font-size:13px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{flex:none;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.94);color:var(--ink);
  display:flex;align-items:center;justify-content:center;transition:background-color .2s ease}
.card:hover .go{background:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 0}

@media (max-width:760px){
  .top{padding:32px 16px 4px}
  .ttl{font-size:34px}
  .chips{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding:14px 12px 16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;white-space:nowrap}
  .pad{padding:0 5px 48px}
  .feed,.col{gap:5px}
  .card{border-radius:10px}
  .meta{left:8px;right:8px;bottom:8px}
  .tag{height:28px;font-size:12px;padding:0 10px}
  .go{display:none}
  .reels{left:8px;top:8px;height:28px;font-size:12px;padding:0 10px}
}
@media (prefers-reduced-motion:reduce){.card img{transition:none}.card:hover img{transform:none}}
</style>
</head>
<body>

<header class="top">
  <h1 class="ttl">Портфолио</h1>
  <div class="sub" id="sub"></div>
</header>

<nav class="chips" id="chips" aria-label="Тип мебели"></nav>

<main class="pad">
  <div class="feed" id="feed"></div>
</main>

<script>
// ===== ПРОЕКТЫ ПОРТФОЛИО =====
// Каждая карточка: обложка (1 фото), название, тип и ссылка на страницу проекта.
// Новые проекты добавлять сюда; порядок в списке = порядок в ленте.
// types — в каких лентах показывать проект;
// reels — видео проекта для ленты REELS (каждое — отдельная плитка): { src: 'assets/<id>-preview.mp4', poster: 'assets/<id>.jpg' }
var PROJECTS = [
  { title: 'Квартира в тёплых тонах', types: ['Комплекс'], cover: 'assets/cover-warm-apartment.jpg', href: 'index.html',
    reels: [
      { src: 'assets/b808bde975a2d936c5b588e3ccd832a6-preview.mp4', poster: 'assets/3e0259f301dba983b78349f5a604e115.jpg' },
      { src: 'assets/e973636b1be0fa442bd7abad4e80c1fc-preview.mp4', poster: 'assets/6c99a6c59a75e664d36f16d87121653d.jpg' },
      { src: 'assets/cc34b5de93f0f3885d7d5bb75804001d-preview.mp4', poster: 'assets/63fd036724736762c0d1b1c7c10fd77c.jpg' }
    ] }
];
var DEFAULT_FILTER = 'Комплекс'; // открывается при заходе на страницу
var FILTERS = ['REELS', 'Комплекс', 'Кухни', 'Шкафы', 'Гардеробные', 'Ванные', 'Детские', 'Гостиные'];

// разная высота плиток — эффект Pinterest
var RATIOS = [[4,5],[3,4],[1,1],[4,5],[2,3],[5,6],[3,4],[4,5]];
var POSES  = ['center','center 40%','center 65%','center','center 55%','center 35%'];

var feed = document.getElementById('feed');
var chipsEl = document.getElementById('chips');
var subEl = document.getElementById('sub');
var filter = DEFAULT_FILTER; // общей ленты нет: всегда открыта одна из лент
var lastKey = '';

function plural(n, a, b, c) {
  var m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return a;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b;
  return c;
}

function readFilter() {
  var h = decodeURIComponent((location.hash || '').slice(1));
  filter = FILTERS.indexOf(h) >= 0 ? h : DEFAULT_FILTER;
}

function listFor(f) {
  if (f === 'REELS') {
    var out = [];
    PROJECTS.forEach(function (p) { (p.reels || []).forEach(function (rl) { out.push({ title: p.title, href: p.href, reel: rl }); }); });
    return out;
  }
  return PROJECTS.filter(function (p) { return p.types.indexOf(f) >= 0; });
}

function renderChips() {
  var html = '';
  FILTERS.forEach(function (f) {
    var n = listFor(f).length;
    html += '<button class="chip" type="button" data-f="' + f + '" aria-pressed="' + (f === filter) + '"' + '>' + f + '<span class="n">' + n + '</span></button>';
  });
  chipsEl.innerHTML = html;
}

// сетка как в ленте проекта: ПК — 4 колонки, планшет — 3, телефон — 2, даже если проектов мало
function colsFor(vw) {
  return vw < 760 ? 2 : vw < 1100 ? 3 : 4;
}

function renderFeed(force) {
  var list = listFor(filter);
  var reels = filter === 'REELS';
  var vw = window.innerWidth;
  var cols = colsFor(vw);
  var key = filter + '|' + cols;
  if (!force && key === lastKey) return;
  lastKey = key;

  var n = list.length;
  subEl.textContent = reels ? n + ' ' + plural(n, 'видео', 'видео', 'видео') : n + ' ' + plural(n, 'проект', 'проекта', 'проектов');
  feed.style.maxWidth = '1920px';
  if (!n) { feed.innerHTML = '<div class="empty">Скоро здесь появятся проекты</div>'; return; }

  // каждую плитку — в самую короткую колонку; фото тянутся, и колонки кончаются ровно
  var columns = [];
  for (var i = 0; i < cols; i++) columns.push({ items: [], h: 0 });
  list.forEach(function (p, k) {
    var r = reels ? [9, 16] : RATIOS[k % RATIOS.length], ratio = r[1] / r[0];
    var best = columns[0];
    columns.forEach(function (c) { if (c.h < best.h - 0.001) best = c; });
    best.items.push({ p: p, pad: (ratio * 100).toFixed(2) + '%', pos: POSES[k % POSES.length], eager: k < cols * 2 });
    best.h += ratio + 0.06;
  });

  feed.innerHTML = columns.map(function (c) {
    return '<div class="col">' + c.items.map(function (it) {
      var t = it.p.title.replace(/"/g, '&quot;');
      var media = reels
        ? '<video data-src="' + it.p.reel.src + '" poster="' + it.p.reel.poster + '" preload="none" muted loop playsinline></video>' +
          '<span class="reels">REELS</span>'
        : '<img src="' + it.p.cover + '" alt="' + t + '" style="object-position:' + it.pos + '" ' +
          (it.eager ? 'fetchpriority="high"' : 'loading="lazy"') + ' decoding="async">';
      return '<div class="cell"><div aria-hidden="true" style="padding-top:' + it.pad + '"></div>' +
        '<a class="card" href="' + it.p.href + '" aria-label="Открыть проект: ' + t + '">' + media +
        '<span class="meta"><span class="tag">' + it.p.title + '</span>' +
        '<span class="go"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></span>' +
        '</a></div>';
    }).join('') + '</div>';
  }).join('');
  watchVideos();
}

// видео в ленте играют, только когда видны на экране
var io = window.IntersectionObserver ? new IntersectionObserver(function (es) {
  es.forEach(function (e) {
    var v = e.target;
    if (e.isIntersecting) {
      if (!v.src) v.src = v.getAttribute('data-src');
      var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
    } else v.pause();
  });
}, { rootMargin: '200px 0px' }) : null;
function watchVideos() {
  feed.querySelectorAll('video').forEach(function (v) {
    if (io) io.observe(v); else { v.src = v.getAttribute('data-src'); v.play(); }
  });
}

chipsEl.addEventListener('click', function (e) {
  var b = e.target.closest('.chip'); if (!b) return;
  var f = b.getAttribute('data-f');
  if (f === filter) return;
  // адрес обновляем, где это разрешено (во встроенных окнах превью — нельзя, лента всё равно переключится)
  try { history.replaceState(null, '', f === DEFAULT_FILTER ? location.pathname : '#' + encodeURIComponent(f)); } catch (err) {}
  filter = f; renderChips(); renderFeed(true);
});
window.addEventListener('hashchange', function () { readFilter(); renderChips(); renderFeed(true); });
var rz;
window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { renderFeed(false); }, 80); });

readFilter(); renderChips(); renderFeed(true);
</script>
</body>
</html>
